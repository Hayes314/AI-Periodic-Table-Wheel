<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>元素週期輪盤 · Periodic Table Wheel</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
  <div id="langBar">
    <button data-lang="zh-Hant" class="active">繁</button>
    <button data-lang="zh-Hans">简</button>
    <button data-lang="en">EN</button>
  </div>

  <section id="startPage" class="page active">
    <div class="title-block">
      <h1 id="i18nTitle">元素週期輪盤</h1>
      <p id="i18nSubtitle">118 種元素 · 轉動抽取 · 直面一克的後果</p>
    </div>
    <button class="start-btn" id="startBtn">開始</button>
    <div class="start-hint" id="i18nHint">抽中後將顯示該元素的完整檔案與口服 1 克單質的後果</div>
  </section>

  <section id="wheelPage" class="page">
    <div id="wheelWrap" title="點擊輪盤開始轉動 / Click the wheel to spin">
      <div id="pointer"></div>
      <canvas id="wheelCanvas" width="900" height="900"></canvas>
      <div id="centerHub"><span>⚛</span></div>
    </div>
    <button id="spinBtn">開始轉動輪盤</button>
    <div id="wheelStatus"></div>
  </section>

  <section id="detailPage" class="page">
    <div class="detail-scroll" id="detailContent"></div>
  </section>
</div>

<script src="./js/data.js"></script>
<script src="./js/logic.js"></script>
</body>
</html>
