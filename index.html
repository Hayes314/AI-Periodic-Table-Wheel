<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>元素週期輪盤 · Periodic Table Wheel</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#111827; --panel2:#1a2332;
    --text:#e5e7eb; --muted:#9ca3af; --accent:#22d3ee;
    --danger:#ef4444; --ok:#34d399;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans TC','Noto Sans SC',sans-serif;}
  #app{height:100%; width:100%; position:relative;}

  /* ---------- 語言切換 ---------- */
  #langBar{position:fixed; top:12px; right:12px; z-index:100; display:flex; gap:6px; background:rgba(0,0,0,.55);
    padding:5px; border-radius:12px; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.08);
    transition:opacity .3s;}
  #langBar button{background:transparent; border:none; color:var(--muted); font-size:12px; padding:6px 10px;
    border-radius:8px; cursor:pointer; font-weight:600; letter-spacing:.3px; transition:.2s;}
  #langBar button.active{background:var(--accent); color:#0a0e17;}
  #langBar button:hover:not(.active){color:#fff; background:rgba(255,255,255,.08);}

  /* ---------- 頁面切換 ---------- */
  .page{position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; padding:20px; opacity:0; transition:opacity .45s ease; overflow:hidden; z-index:1;}
  .page.active{display:flex; opacity:1; z-index:10;}

  /* ---------- 開始頁 ---------- */
  #startPage{background:radial-gradient(ellipse at 50% 30%,#152238 0%,#0a0e17 70%);}
  .title-block{text-align:center; margin-bottom:36px; z-index:2;}
  .title-block h1{font-size:clamp(28px,5vw,52px); margin:0 0 8px; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,#22d3ee,#a78bfa,#f472b6); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent;}
  .title-block p{color:var(--muted); font-size:clamp(13px,1.8vw,16px); margin:0; max-width:560px; line-height:1.6;}
  .start-btn{padding:16px 52px; font-size:18px; font-weight:800; border:none; border-radius:60px; cursor:pointer;
    background:linear-gradient(135deg,#22d3ee,#3b82f6); color:#04121f; letter-spacing:.5px;
    box-shadow:0 0 40px rgba(34,211,238,.35); transition:.25s; z-index:2;}
  .start-btn:hover{transform:translateY(-2px) scale(1.02); box-shadow:0 0 60px rgba(34,211,238,.55);}
  .start-btn:active{transform:scale(.97);}
  .start-hint{margin-top:18px; font-size:12px; color:var(--muted); opacity:.7; z-index:2;}

  /* ---------- 轉盤頁 ---------- */
  #wheelPage{background:radial-gradient(ellipse at 50% 40%,#111b2b 0%,#0a0e17 75%); gap:18px;}
  #wheelWrap{position:relative; width:min(82vmin,520px); height:min(82vmin,520px); flex-shrink:0; cursor:pointer;}
  #wheelCanvas{width:100%; height:100%; display:block; border-radius:50%;
    box-shadow:0 0 0 2px rgba(34,211,238,.15), 0 0 60px rgba(0,0,0,.7), inset 0 0 80px rgba(0,0,0,.5);}
  #pointer{position:absolute; top:-6px; left:50%; transform:translateX(-50%); z-index:5;
    width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent;
    border-top:34px solid var(--accent); filter:drop-shadow(0 2px 6px rgba(34,211,238,.6)); pointer-events:none;}
  #centerHub{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:4;
    width:clamp(64px,12vmin,90px); height:clamp(64px,12vmin,90px); border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#1e293b,#0f172a); border:3px solid rgba(34,211,238,.4);
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 30px rgba(0,0,0,.8), inset 0 0 20px rgba(0,0,0,.6);
    pointer-events:none;}
  #centerHub span{font-size:clamp(22px,4.5vmin,34px); filter:drop-shadow(0 0 8px rgba(34,211,238,.5));}

  #spinBtn{padding:16px 56px; font-size:clamp(16px,2.4vw,20px); font-weight:800; border:none; border-radius:60px;
    cursor:pointer; background:linear-gradient(135deg,#f59e0b,#ef4444); color:#fff; letter-spacing:.5px;
    box-shadow:0 8px 32px rgba(239,68,68,.4); transition:.2s; z-index:10;}
  #spinBtn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 12px 40px rgba(239,68,68,.55);}
  #spinBtn:active:not(:disabled){transform:scale(.97);}
  #spinBtn:disabled{opacity:.35; cursor:not-allowed; filter:grayscale(.5);}
  #wheelStatus{font-size:13px; color:var(--muted); height:20px; letter-spacing:.4px;}

  /* ---------- 詳情頁 ---------- */
  #detailPage{justify-content:flex-start; overflow-y:auto; padding:0; background:var(--bg);}
  #detailPage.active{display:block;}
  .detail-scroll{max-width:900px; margin:0 auto; padding:32px 22px 40px; min-height:100%;}
  .detail-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap;}
  .element-hero{display:flex; align-items:center; gap:18px;}
  .element-badge{width:76px; height:76px; border-radius:18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-weight:800; line-height:1.1; flex-shrink:0;}
  .element-badge .num{font-size:12px; opacity:.8; font-weight:600;}
  .element-badge .sym{font-size:30px;}
  .element-name-block h2{margin:0; font-size:clamp(24px,3.5vw,34px); font-weight:800;}
  .element-name-block .en{color:var(--muted); font-size:15px; font-weight:500;}
  .element-tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .tag{font-size:11px; padding:3px 10px; border-radius:20px; background:rgba(34,211,238,.12);
    color:var(--accent); border:1px solid rgba(34,211,238,.25); font-weight:600;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:22px 0;}
  .stat-card{background:var(--panel); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:14px 16px;}
  .stat-card .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px;}
  .stat-card .value{font-size:17px; font-weight:700;}
  .stat-card .value small{font-size:12px; color:var(--muted); font-weight:500;}

  .section-block{background:var(--panel); border:1px solid rgba(255,255,255,.06); border-radius:16px;
    padding:20px 22px; margin-bottom:14px;}
  .section-block h3{margin:0 0 12px; font-size:15px; color:var(--accent); letter-spacing:.5px;
    display:flex; align-items:center; gap:8px;}
  .section-block p{margin:0 0 10px; font-size:14px; line-height:1.75; color:#cbd5e1;}
  .section-block p:last-child{margin-bottom:0;}
  .section-block .bullet{display:flex; gap:10px; margin-bottom:10px; font-size:14px; line-height:1.7; color:#cbd5e1;}
  .section-block .bullet:last-child{margin-bottom:0;}
  .section-block .bullet .dot{color:var(--accent); flex-shrink:0; font-weight:800;}
  .section-block .mini-label{display:inline-block; font-size:11px; font-weight:700; color:var(--accent);
    background:rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.2); padding:2px 9px;
    border-radius:6px; margin-bottom:8px; letter-spacing:.5px;}

  .danger-block{background:linear-gradient(135deg,rgba(127,29,29,.35),rgba(69,10,10,.45));
    border:1px solid rgba(239,68,68,.35); border-radius:16px; padding:20px 22px; margin-bottom:18px;}
  .danger-block h3{margin:0 0 12px; font-size:15px; color:#fca5a5; letter-spacing:.5px;}
  .danger-block p{margin:0; font-size:14px; line-height:1.8; color:#fecaca;}
  .danger-block .warn-label{display:inline-block; font-size:10px; font-weight:800; letter-spacing:1px;
    background:var(--danger); color:#fff; padding:2px 8px; border-radius:4px; margin-right:8px; vertical-align:middle;}

  .again-btn{display:block; width:100%; max-width:420px; margin:26px auto 0; padding:16px;
    font-size:17px; font-weight:800; border:none; border-radius:60px; cursor:pointer;
    background:linear-gradient(135deg,#22d3ee,#3b82f6); color:#04121f; letter-spacing:.5px;
    box-shadow:0 8px 30px rgba(34,211,238,.3); transition:.2s;}
  .again-btn:hover{transform:translateY(-2px); box-shadow:0 12px 40px rgba(34,211,238,.45);}
  .again-btn:active{transform:scale(.97);}

  @media (max-width:520px){
    .detail-scroll{padding:24px 14px 32px;}
    .element-badge{width:62px;height:62px;}
    .element-badge .sym{font-size:24px;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    #spinBtn{padding:14px 40px;}
  }
</style>
</head>

  </section>

  <!-- 詳情頁 -->
  <section id="detailPage" class="page">
    <div class="detail-scroll" id="detailContent"></div>
  </section>

</div>

    fact:{zhHant:'鈉的黃色焰色反應是路燈的經典顏色。液態鈉在核反應爐中作為熱傳導介質。',zhHans:'钠的黄色焰色反应是路灯的经典颜色。液态钠在核反应堆中作为热传导介质。',en:'The yellow flame test of sodium is the classic street-lamp colour. Liquid sodium serves as a heat-transfer medium in nuclear reactors.'}

  12:{
    occurrence:{zhHant:'以白雲石、菱鎂礦與海水中的鎂離子形式存在，不以單質存在。地殼中含量約 2.3%，海水含大量可溶性鎂鹽。',zhHans:'以白云石、菱镁矿与海水中的镁离子形式存在，不以单质存在。地壳中含量约 2.3%，海水含大量可溶性镁盐。',en:'Occurs as dolomite, magnesite and magnesium ions in seawater; never found free. It makes up about 2.3% of the crust, and seawater contains abundant soluble magnesium salts.'},
    uses:{zhHant:'輕合金（航空、汽車）、煙火與閃光粉、葉綠素的核心金屬、瀉鹽（硫酸鎂）與耐火材料。',zhHans:'轻合金（航空、汽车）、烟火与闪光粉、叶绿素的核心金属、泻盐（硫酸镁）与耐火材料。',en:'Light alloys (aerospace, automotive), fireworks and flares, the core metal of chlorophyll, Epsom salt (magnesium sulfate) and refractories.'},
    fact:{zhHant:'鎂是葉綠素分子的核心金屬，沒有鎂就沒有光合作用。鎂燃燒時發出耀眼白光，早期閃光粉即用鎂。',zhHans:'镁是叶绿素分子的核心金属，没有镁就没有光合作用。镁燃烧时发出耀眼白光，早期闪光粉即用镁。',en:'Magnesium is the central metal of the chlorophyll molecule; without it there is no photosynthesis. Burning magnesium emits a brilliant white light, used in early flash powder.'}

  13:{
    occurrence:{zhHant:'地殼中含量最高的金屬元素（約 8%），主要以鋁土礦（Al₂O₃·nH₂O）形式存在，少數地區有剛玉等寶石礦藏。',zhHans:'地壳中含量最高的金属元素（约 8%），主要以铝土矿（Al₂O₃·nH₂O）形式存在，少数地区有刚玉等宝石矿藏。',en:'The most abundant metal in Earth\'s crust (about 8%), mainly as bauxite (Al₂O₃·nH₂O), with some gemstone deposits like corundum.'},
    uses:{zhHant:'輕質結構材料（飛機、汽車、建築）、包裝箔、電纜與炊具；氧化鋁用於冶煉與陶瓷。',zhHans:'轻质结构材料（飞机、汽车、建筑）、包装箔、电缆与炊具；氧化铝用于冶炼与陶瓷。',en:'Lightweight structural material (aircraft, cars, construction), packaging foil, cables and cookware; alumina is used in smelting and ceramics.'},
    fact:{zhHant:'鋁在空氣中會迅速形成緻密氧化膜而鈍化，因此耐腐蝕。19 世紀時鋁曾比黃金還貴，直到電解煉鋁法問世。',zhHans:'铝在空气中会迅速形成致密氧化膜而钝化，因此耐腐蚀。19 世纪时铝曾比黄金还贵，直到电解炼铝法问世。',en:'Aluminium passivates rapidly in air by forming a dense oxide film, making it corrosion-resistant. In the 19th century aluminium was more expensive than gold until electrolytic smelting was invented.'}
  },
  14:{
    occurrence:{zhHant:'地殼中第二豐富的元素（約 28%），主要以二氧化矽（石英、砂）與矽酸鹽礦物形式存在，極少以單質游離態出現。',zhHans:'地壳中第二丰富的元素（约 28%），主要以二氧化硅（石英、砂）与硅酸盐矿物形式存在，极少以单质游离态出现。',en:'The second most abundant element in Earth\'s crust (about 28%), mainly as silica (quartz, sand) and silicate minerals; rarely found free.'},

    fact:{zhHant:'矽是現代電子工業的基石；高純度單晶矽的純度可達 99.9999999% 以上。',zhHans:'硅是现代电子工业的基石；高纯度单晶硅的纯度可达 99.9999999% 以上。',en:'Silicon is the cornerstone of the modern electronics industry; high-purity monocrystalline silicon can exceed 99.9999999% purity.'}
  },
  15:{
    occurrence:{zhHant:'主要以磷酸鹽礦物（磷灰石）形式存在，是生物體（DNA、ATP、骨骼）的必需元素。自然界無游離態的磷。',zhHans:'主要以磷酸盐矿物（磷灰石）形式存在，是生物体（DNA、ATP、骨骼）的必需元素。自然界无游离态的磷。',en:'Occurs mainly as phosphate minerals (apatite); an essential element in living organisms (DNA, ATP, bones). Never found free in nature.'},
    uses:{zhHant:'磷肥、洗滌劑、火柴、煙火與食品添加劑；白磷用於軍事煙幕。',zhHans:'磷肥、洗涤剂、火柴、烟火与食品添加剂；白磷用于军事烟幕。',en:'Phosphorus fertilisers, detergents, matches, fireworks and food additives; white phosphorus is used in military smoke screens.'},
    fact:{zhHant:'磷是第一個由人類從尿液中分離出的元素（1669 年，布蘭德）。白磷在空氣中會自燃，需保存在水中。',zhHans:'磷是第一个由人类从尿液中分离出的元素（1669 年，布兰德）。白磷在空气中会自燃，需保存在水中。',en:'Phosphorus was the first element isolated by humans, from urine (1669, Brand). White phosphorus ignites spontaneously in air and must be stored under water.'}

  16:{
    occurrence:{zhHant:'以單質（火山硫）與硫化物（黃鐵礦、黃銅礦）及硫酸鹽（石膏）形式存在。地殼中丰度約 0.035%。',zhHans:'以单质（火山硫）与硫化物（黄铁矿、黄铜矿）及硫酸盐（石膏）形式存在。地壳中丰度约 0.035%。',en:'Occurs as native sulfur (volcanic), sulfides (pyrite, chalcopyrite) and sulfates (gypsum). Crustal abundance is about 0.035%.'},

    fact:{zhHant:'硫是古代已知的元素之一，聖經中多次提及「硫磺與火」。硫酸被稱為「化學工業之母」。',zhHans:'硫是古代已知的元素之一，圣经中多次提及“硫磺与火”。硫酸被称为“化学工业之母”。',en:'Sulfur was known in antiquity and is mentioned repeatedly in the Bible ("fire and brimstone"). Sulfuric acid is called the "mother of the chemical industry".'}
  },
  17:{

    fact:{zhHant:'氯氣在第一次世界大戰中曾被用作化學武器，促使日內瓦議定書禁止化學武器。氯是海水中含量最高的鹵素。',zhHans:'氯气在第一次世界大战中曾被用作化学武器，促使日内瓦议定书禁止化学武器。氯是海水中含量最高的卤素。',en:'Chlorine gas was used as a chemical weapon in World War I, prompting the Geneva Protocol banning chemical weapons. Chlorine is the most abundant halogen in seawater.'}

  18:{
    occurrence:{zhHant:'大氣中含量約 0.93%，是含量最高的稀有氣體，主要來自鉀-40 的放射性衰變。地殼中亦有微量。',zhHans:'大气中含量约 0.93%，是含量最高的稀有气体，主要来自钾-40 的放射性衰变。地壳中亦有微量。',en:'About 0.93% of the atmosphere, the most abundant noble gas, mainly from radioactive decay of potassium-40. Trace amounts also occur in the crust.'},

  19:{
    occurrence:{zhHant:'以鉀鹽（鉀石鹽、光鹵石）形式存在，是植物生長的三大必需元素之一。地殼中丰度約 2.1%。',zhHans:'以钾盐（钾石盐、光卤石）形式存在，是植物生长的三大必需元素之一。地壳中丰度约 2.1%。',en:'Occurs as potassium salts (sylvite, carnallite); one of the three essential elements for plant growth. Crustal abundance is about 2.1%.'},

    fact:{zhHant:'鉀是人體細胞內最主要的陽離子，對神經與肌肉功能至關重要。鉀的焰色反應呈紫色。',zhHans:'钾是人体细胞内最主要的阳离子，对神经与肌肉功能至关重要。钾的焰色反应呈紫色。',en:'Potassium is the main intracellular cation in the human body, essential for nerve and muscle function. Its flame test is violet.'}

  20:{
    occurrence:{zhHant:'以石灰石（CaCO₃）、石膏（CaSO₄·2H₂O）與螢石等形式大量存在，是骨骼與牙齒的主要成分。地殼中丰度約 4.1%。',zhHans:'以石灰石（CaCO₃）、石膏（CaSO₄·2H₂O）与萤石等形式大量存在，是骨骼与牙齿的主要成分。地壳中丰度约 4.1%。',en:'Occurs abundantly as limestone (CaCO₃), gypsum (CaSO₄·2H₂O) and fluorite; the main component of bones and teeth. Crustal abundance is about 4.1%.'},
    uses:{zhHant:'水泥與石灰、鋼鐵冶煉助熔劑、鈣片與骨骼健康、農業土壤改良。',zhHans:'水泥与石灰、钢铁冶炼助熔剂、钙片与骨骼健康、农业土壤改良。',en:'Cement and lime, steelmaking flux, calcium supplements and bone health, agricultural soil improvement.'},
    fact:{zhHant:'鈣是人體含量最高的金屬元素，約 99% 存在於骨骼與牙齒中。石灰石與大理石的主要成分都是碳酸鈣。',zhHans:'钙是人体含量最高的金属元素，约 99% 存在于骨骼与牙齿中。石灰石与大理石的主要成分都是碳酸钙。',en:'Calcium is the most abundant metal in the human body, about 99% in bones and teeth. Limestone and marble are both mainly calcium carbonate.'}

  26:{
    occurrence:{zhHant:'地殼中含量第四的元素，主要以赤鐵礦（Fe₂O₃）、磁鐵礦（Fe₃O₄）與黃鐵礦形式存在。地球核心主要由鐵鎳合金組成。',zhHans:'地壳中含量第四的元素，主要以赤铁矿（Fe₂O₃）、磁铁矿（Fe₃O₄）与黄铁矿形式存在。地球核心主要由铁镍合金组成。',en:'The fourth most abundant element in Earth\'s crust, mainly as haematite (Fe₂O₃), magnetite (Fe₃O₄) and pyrite. Earth\'s core is mainly an iron-nickel alloy.'},

  29:{

  30:{
    occurrence:{zhHant:'主要以閃鋅礦（ZnS）與菱鋅礦（ZnCO₃）形式存在，不以單質存在。地殼中丰度約 0.007%。',zhHans:'主要以闪锌矿（ZnS）与菱锌矿（ZnCO₃）形式存在，不以单质存在。地壳中丰度约 0.007%。',en:'Occurs mainly as sphalerite (ZnS) and smithsonite (ZnCO₃); never found free. Crustal abundance is about 0.007%.'},
    uses:{zhHant:'鍍鋅防腐、電池（鋅錳電池）、黃銅合金、氧化鋅防曬與皮膚藥膏。',zhHans:'镀锌防腐、电池（锌锰电池）、黄铜合金、氧化锌防晒与皮肤药膏。',en:'Galvanising for corrosion protection, batteries (zinc-carbon), brass alloys, zinc oxide sunscreen and skin ointments.'},

    fact:{zhHant:'銀是導電性與導熱性最好的金屬，但因價格較高而多用於電子與首飾。硝酸銀是經典的檢驗氯離子試劑。',zhHans:'银是导电性与导热性最好的金属，但因价格较高而多用于电子与首饰。硝酸银是经典的检验氯离子试剂。',en:'Silver has the highest electrical and thermal conductivity of all metals but is mostly used in electronics and jewellery due to cost. Silver nitrate is the classic chloride test reagent.'}

  if(GAS_SYMS.includes(el.sym)) return {zhHant:'熔點與沸點極低，在常溫常壓下完全以氣態形式存在，極難液化。',zhHans:'熔点与沸点极低，在常温常压下完全以气态形式存在，极难液化。',en:'extremely low melting and boiling points; exists entirely as a gas at standard conditions and is very hard to liquefy.'}[langKey];
  if(LIQUID_SYMS.includes(el.sym)) return {zhHant:'熔點低於室溫而沸點較高，因此在常溫下呈液態，具有明顯的揮發性。',zhHans:'熔点低于室温而沸点较高，因此在常温下呈液态，具有明显的挥发性。',en:'melting point below room temperature and boiling point well above it; liquid at room temperature with noticeable volatility.'}[langKey];
  if(el.cat==='鹼金屬') return {zhHant:'熔點與沸點偏低，質地柔軟易熔，銫甚至在人體體溫下就能熔化。',zhHans:'熔点与沸点偏低，质地柔软易熔，铯甚至在人体体温下就能熔化。',en:'relatively low melting and boiling points; soft and easily melted (caesium melts at body temperature).'}[langKey];
  if(el.cat==='過渡金屬') return {zhHant:'熔點與沸點通常很高（鎢的熔點約 3422°C，為所有金屬之最），耐高溫性能優異。',zhHans:'熔点与沸点通常很高（钨的熔点约 3422°C，为所有金属之最），耐高温性能优异。',en:'typically very high melting and boiling points (tungsten melts at about 3422°C, the highest of all metals), with excellent heat resistance.'}[langKey];
  if(el.cat==='稀有氣體') return {zhHant:'熔點與沸點極低，極易揮發，需在極低溫下才能液化或固化。',zhHans:'熔点与沸点极低，极易挥发，需在极低温下才能液化或固化。',en:'extremely low melting and boiling points; highly volatile, requiring very low temperatures to liquefy or solidify.'}[langKey];
  if(el.cat==='超重元素') return {zhHant:'數據不足，理論預測其熔沸點較高，但半衰期極短，難以進行物理測量。',zhHans:'数据不足，理论预测其熔沸点较高，但半衰期极短，难以进行物理测量。',en:'data insufficient; theory predicts relatively high melting/boiling points, but extremely short half-lives make physical measurement difficult.'}[langKey];
  return {zhHant:'熔點與沸點中等偏高，具有一定的熱穩定性與揮發性。',zhHans:'熔点与沸点中等偏高，具有一定的热稳定性与挥发性。',en:'moderately high melting and boiling points with some thermal stability and volatility.'}[langKey];
}

function getDensityHint(el, langKey){
  const sym = el.sym;
  if(sym==='Li') return {zhHant:'密度約 0.53 g/cm³，是已知最輕的金屬，甚至可以浮在水面上。',zhHans:'密度约 0.53 g/cm³，是已知最轻的金属，甚至可以浮在水面上。',en:'about 0.53 g/cm³, the lightest known metal; it can even float on water.'}[langKey];
  if(sym==='Os') return {zhHant:'密度約 22.6 g/cm³，是已知密度最大的天然元素之一，質地堅硬沉重。',zhHans:'密度约 22.6 g/cm³，是已知密度最大的天然元素之一，质地坚硬沉重。',en:'about 22.6 g/cm³, one of the densest naturally occurring elements; hard and heavy.'}[langKey];
  if(sym==='Ir') return {zhHant:'密度約 22.6 g/cm³，與鋨同為已知密度最大的元素，極其堅硬。',zhHans:'密度约 22.6 g/cm³，与锇同为已知密度最大的元素，极其坚硬。',en:'about 22.6 g/cm³, among the densest known elements along with osmium; extremely hard.'}[langKey];
  if(GAS_SYMS.includes(sym)) return {zhHant:'氣態密度極低，遠小於空氣或略大於空氣，依具體元素而異。',zhHans:'气态密度极低，远小于空气或略大于空气，依具体元素而异。',en:'very low density in the gaseous state, either much less than or slightly greater than air depending on the element.'}[langKey];
  if(el.cat==='鹼金屬') return {zhHant:'密度很低，是典型的輕金屬，鋰、鈉、鉀的密度均小於水的密度。',zhHans:'密度很低，是典型的轻金属，锂、钠、钾的密度均小于水的密度。',en:'very low density, typical light metals; lithium, sodium and potassium all have densities less than water.'}[langKey];
  if(el.cat==='過渡金屬') return {zhHant:'密度較高，多數屬於重金屬，具有沉甸甸的手感與良好的機械強度。',zhHans:'密度较高，多数属于重金属，具有沉甸甸的手感与良好的机械强度。',en:'relatively high density; mostly heavy metals with a substantial feel and good mechanical strength.'}[langKey];
  return {zhHant:'密度中等，因元素不同而有所差異，通常介於輕金屬與重金屬之間。',zhHans:'密度中等，因元素不同而有所差异，通常介于轻金属与重金属之间。',en:'moderate density, varying by element, typically between light and heavy metals.'}[langKey];
}

function getChemistry(el, langKey){
  const c = el.cat;
  const map = {
    '鹼金屬':{zhHant:'鹼金屬最外層只有一個電子，極易失去而形成 +1 價陽離子。這使得它們化學活性極高，能與水劇烈反應生成氫氧化合物和氫氣，也極易與氧氣、鹵素、硫等非金屬直接化合。因為活性太強，自然界中不存在游離態的鹼金屬，通常儲存在礦物油中隔絕空氣與水分。',zhHans:'碱金属最外层只有一个电子，极易失去而形成 +1 价阳离子。这使得它们化学活性极高，能与水剧烈反应生成氢氧化物和氢气，也极易与氧气、卤素、硫等非金属直接化合。因为活性太强，自然界中不存在游离态的碱金属，通常储存在矿物油中隔绝空气与水分。',en:'Alkali metals have a single valence electron that is easily lost to form +1 cations, making them extremely reactive. They react violently with water to produce hydroxide and hydrogen gas, and combine directly with oxygen, halogens and sulfur. Because of their high reactivity, they never occur naturally in elemental form and are usually stored under mineral oil to exclude air and moisture.'},
    '鹼土金屬':{zhHant:'鹼土金屬最外層有兩個電子，容易失去形成 +2 價陽離子，化學活性僅次於鹼金屬。它們能與水反應（鎂需熱水，鈣與冷水反應較慢），在空氣中燃燒生成氧化物，並能與鹵素、硫等非金屬化合。其氧化物呈鹼性，難溶於水。',zhHans:'碱土金属最外层有两个电子，容易失去形成 +2 价阳离子，化学活性仅次于碱金属。它们能与水反应（镁需热水，钙与冷水反应较慢），在空气中燃烧生成氧化物，并能与卤素、硫等非金属化合。其氧化物呈碱性，难溶于水。',en:'Alkaline earth metals have two valence electrons and readily form +2 cations. Their reactivity is slightly lower than that of alkali metals. They react with water (magnesium requires hot water; calcium reacts slowly with cold water), burn in air to form oxides, and combine with halogens and sulfur. Their oxides are basic and sparingly soluble in water.'},
    '過渡金屬':{zhHant:'過渡金屬具有部分填充的 d 軌域，能呈現多種氧化態（如鐵的 +2、+3，錳的 +2 至 +7），並形成豐富的配位化合物。它們通常具有良好的導電、導熱性與延展性，許多元素及其化合物具有催化活性，是工業催化劑的重要來源。',zhHans:'过渡金属具有部分填充的 d 轨道，能呈现多种氧化态（如铁的 +2、+3，锰的 +2 至 +7），并形成丰富的配位化合物。它们通常具有良好的导电、导热性与延展性，许多元素及其化合物具有催化活性，是工业催化剂的重要来源。',en:'Transition metals have partially filled d orbitals, exhibit multiple oxidation states (e.g., Fe +2/+3, Mn +2 to +7) and form rich coordination compounds. They are typically good conductors of heat and electricity, malleable, and many serve as catalysts, making them vital industrial catalysts.'},
    '鑭系':{zhHant:'鑭系元素的最外層電子構型相似，化學性質相近，主要以 +3 氧化態存在。它們活性較高，能與水及酸反應，在空氣中易氧化失去光澤，因此需妥善保存。鑭系元素常用於製造強力磁鐵與發光材料。',zhHans:'镧系元素的最外层电子构型相似，化学性质相近，主要以 +3 氧化态存在。它们活性较高，能与水及酸反应，在空气中易氧化失去光泽，因此需妥善保存。镧系元素常用于制造强力磁铁与发光材料。',en:'Lanthanides share similar outer electron configurations, giving them closely related chemical properties. They exist mainly in the +3 oxidation state, are fairly reactive, react with water and acids, and oxidise readily in air, requiring careful storage. They are widely used in strong magnets and luminescent materials.'},
    '錒系':{zhHant:'錒系元素均具放射性，最外層電子構型多樣。鈾、鈽等可用作核燃料；錒系金屬化學活性高，能與水、氧氣反應，且多數具有自燃性。由於放射性強，操作時需嚴格防護。',zhHans:'锕系元素均具放射性，最外层电子构型多样。铀、钚等可用作核燃料；锕系金属化学活性高，能与水、氧气反应，且多数具有自燃性。由于放射性强，操作时需严格防护。',en:'All actinides are radioactive. Their outer electron configurations vary. Uranium and plutonium serve as nuclear fuels; actinide metals are chemically reactive, react with water and oxygen, and many are pyrophoric. Due to intense radioactivity, strict precautions are required.'},
    '鹵素':{zhHant:'鹵素最外層有七個電子，極易獲得一個電子形成 -1 價陰離子，氧化性很強。氟是最強的氧化劑之一；氯、溴、碘的氧化性依次減弱。鹵素能與大多數金屬及非金屬反應，生成鹵化物，其活潑性隨原子序增加而降低。',zhHans:'卤素最外层有七个电子，极易获得一个电子形成 -1 价阴离子，氧化性很强。氟是最强的氧化剂之一；氯、溴、碘的氧化性依次减弱。卤素能与大多数金属及非金属反应，生成卤化物，其活泼性随原子序增加而降低。',en:'Halogens have seven valence electrons and readily gain one electron to form -1 anions, making them strong oxidising agents. Fluorine is one of the strongest oxidisers; oxidising power decreases from chlorine to bromine to iodine. Halogens react with most metals and nonmetals to form halides, with reactivity decreasing down the group.'},
    '稀有氣體':{zhHant:'稀有氣體的價電子層已填滿，化學性質極不活潑，通常以單原子氣體形式存在。在極端條件下，氙、氪等可與氟、氧形成少數化合物（如 XeF₄、XeO₃）。它們的沸點極低，常被用作低溫冷卻劑與保護氣。',zhHans:'稀有气体的价电子层已填满，化学性质极不活泼，通常以单原子气体形式存在。在极端条件下，氙、氪等可与氟、氧形成少数化合物（如 XeF₄、XeO₃）。它们的沸点极低，常被用作低温冷却剂与保护气。',en:'Noble gases have filled valence shells and are chemically inert, existing as monatomic gases. Under extreme conditions, xenon and krypton can form a few compounds with fluorine and oxygen (e.g., XeF₄, XeO₃). Their extremely low boiling points make them useful as cryogenic coolants and shielding gases.'},
    '類金屬':{zhHant:'類金屬的性質介於金屬與非金屬之間，常表現出半導體特性，並能形成酸性或鹼性氧化物。它們的化學活性因元素而異，例如硼在常溫下非常穩定，而砷則具有一定的毒性與反應性。',zhHans:'类金属的性质介于金属与非金属之间，常表现出半导体特性，并能形成酸性或碱性氧化物。它们的化学活性因元素而异，例如硼在常温下非常稳定，而砷则具有一定的毒性与反应性。',en:'Metalloids have properties intermediate between metals and nonmetals, often showing semiconductor behaviour and forming acidic or basic oxides. Chemical reactivity varies by element; for example, boron is very stable at room temperature, while arsenic has significant toxicity and reactivity.'},
    '非金屬':{zhHant:'非金屬的價電子層通常未填滿，傾向於獲得或共用電子。它們可形成共價分子、離子或網狀固體，化學性質多樣，從高活性的氟、氧到惰性的碳皆有。非金屬是構成有機物與生命體的核心元素。',zhHans:'非金属的价电子层通常未填满，倾向于获得或共用电子。它们可形成共价分子、离子或网状固体，化学性质多样，从高活性的氟、氧到惰性的碳皆有。非金属是构成有机物与生命体的核心元素。',en:'Nonmetals usually have incompletely filled valence shells and tend to gain or share electrons. They form covalent molecules, ions or network solids, with chemical behaviour ranging from highly reactive fluorine and oxygen to relatively inert carbon. Nonmetals are core elements in organic matter and living organisms.'},
    '貧金屬':{zhHant:'貧金屬的性質介於過渡金屬與類金屬之間，熔點較低、質地較軟，但仍具有金屬光澤與導電性。它們的化學活性中等，能與酸或鹼反應，常用於製造合金與半導體材料。',zhHans:'贫金属的性质介于过渡金属与类金属之间，熔点较低、质地较软，但仍具有金属光泽与导电性。它们的化学活性中等，能与酸或碱反应，常用于制造合金与半导体材料。',en:'Post-transition metals have properties between transition metals and metalloids. They are softer, lower-melting, but still lustrous and conductive, with moderate chemical reactivity. They react with acids or bases and are often used in alloys and semiconductors.'},
    '超重元素':{zhHant:'超重元素為人工合成的放射性元素，半衰期極短（多在毫秒至秒級），化學性質主要依靠理論預測。它們的合成驗證了核物理學的理論模型，但實際化學研究極其困難。',zhHans:'超重元素为人工合成的放射性元素，半衰期极短（多在毫秒至秒级），化学性质主要依靠理论预测。它们的合成验证了核物理学的理论模型，但实际化学研究极其困难。',en:'Superheavy elements are synthetic radioactive elements with very short half-lives (often milliseconds to seconds); their chemistry is largely predicted theoretically. Their synthesis validates nuclear physics models, but practical chemical studies are extremely difficult.'}
  };
  return (map[c]||map['過渡金屬'])[langKey];
}

function getOccurrence(el, langKey){
  if(SPECIFIC[el.num] && SPECIFIC[el.num].occurrence && SPECIFIC[el.num].occurrence[langKey]) return SPECIFIC[el.num].occurrence[langKey];
  const c = el.cat;
  const map = {
    '鹼金屬':{zhHant:'以化合物形式存在於海水、鹽湖與礦物（如岩鹽、鋰輝石）中，因化學活性高而不以單質存在於自然界。它們在海水中的含量豐富，是工業提取的重要來源。',zhHans:'以化合物形式存在于海水、盐湖与矿物（如岩盐、锂辉石）中，因化学活性高而不以单质存在于自然界。它们在海水中的含量丰富，是工业提取的重要来源。',en:'Occurs as compounds in seawater, salt lakes and minerals (e.g., rock salt, spodumene); never found free because of its high reactivity. Seawater is a rich source and an important industrial feedstock.'},
    '鹼土金屬':{zhHant:'以碳酸鹽、硫酸鹽與矽酸鹽礦物形式存在，如石灰石、白雲石、石膏，不以單質存在。它們在地殼中分佈廣泛，是構成岩石與土壤的重要成分。',zhHans:'以碳酸盐、硫酸盐与硅酸盐矿物形式存在，如石灰石、白云石、石膏，不以单质存在。它们在地壳中分布广泛，是构成岩石与土壤的重要成分。',en:'Occurs as carbonate, sulfate and silicate minerals such as limestone, dolomite and gypsum; never found free. They are widely distributed in the crust and are important components of rocks and soil.'},
    '過渡金屬':{zhHant:'多以氧化物、硫化物或矽酸鹽礦物形式存在於地殼中，少數（如金、銀、銅）可以單質形式存在。它們的礦床類型多樣，是全球礦產資源的重要組成部分。',zhHans:'多以氧化物、硫化物或硅酸盐矿物形式存在于地壳中，少数（如金、银、铜）可以单质形式存在。它们的矿床类型多样，是全球矿产资源的重要组成部分。',en:'Mostly found in Earth\'s crust as oxide, sulfide or silicate minerals; a few (e.g., gold, silver, copper) can occur natively. They form diverse ore deposits and are key global mineral resources.'},
    '鑭系':{zhHant:'以磷酸鹽、碳酸鹽與矽酸鹽礦物（如獨居石、氟碳鈰礦）形式存在，常彼此共生，分離困難。它們在地殼中並不罕見，但提純技術複雜，被稱為「稀土元素」。',zhHans:'以磷酸盐、碳酸盐与硅酸盐矿物（如独居石、氟碳铈矿）形式存在，常彼此共生，分离困难。它们在地壳中并不罕见，但提纯技术复杂，被称为“稀土元素”。',en:'Occurs in phosphate, carbonate and silicate minerals (e.g., monazite, bastnäsite), often together, making separation difficult. They are not rare in the crust but require complex purification, hence the name "rare-earth elements".'},
    '錒系':{zhHant:'鈾、釷等以礦物形式存在於地殼；錼及以後的元素多為人工合成，自然界含量極微或不存在。鈾礦是核能工業的基礎資源，主要分佈於澳洲、哈薩克等地。',zhHans:'铀、钍等以矿物形式存在于地壳；镎及以后的元素多为人工合成，自然界含量极微或不存在。铀矿是核能工业的基础资源，主要分布于澳洲、哈萨克等地。',en:'Uranium and thorium occur in crustal minerals; neptunium and heavier elements are mostly synthetic and occur only in trace amounts or not at all in nature. Uranium ore is the foundation of the nuclear industry, mainly in Australia and Kazakhstan.'},
    '鹵素':{zhHant:'以鹵化物礦物（如食鹽、螢石）與海水中的鹵離子形式存在，不以單質大量存在。海洋是鹵素最大的儲庫，海水中含有大量的氯、溴與碘。',zhHans:'以卤化物矿物（如食盐、萤石）与海水中的卤离子形式存在，不以单质大量存在。海洋是卤素最大的储库，海水中含有大量的氯、溴与碘。',en:'Occurs as halide minerals (e.g., halite, fluorite) and as halide ions in seawater; not abundant in elemental form. The oceans are the largest reservoir, containing abundant chlorine, bromine and iodine.'},
    '稀有氣體':{zhHant:'主要以單原子氣體形式存在於大氣中，含量極低；氦也來自天然氣田與放射性衰變。它們的提取依賴空氣分餾或天然氣處理，成本較高。',zhHans:'主要以单原子气体形式存在于大气中，含量极低；氦也来自天然气田与放射性衰变。它们的提取依赖空气分馏或天然气处理，成本较高。',en:'Occurs mainly as monatomic gases in the atmosphere at very low concentrations; helium also comes from natural-gas fields and radioactive decay. Extraction relies on air fractionation or natural-gas processing, making them costly.'},
    '類金屬':{zhHant:'以硫化物、氧化物或單質形式存在於地殼中，含量差異很大。例如矽以氧化物形式大量存在，而砷、銻等多以硫化物形式伴生於金屬礦中。',zhHans:'以硫化物、氧化物或单质形式存在于地壳中，含量差异很大。例如硅以氧化物形式大量存在，而砷、锑等多以硫化物形式伴生于金属矿中。',en:'Occurs in Earth\'s crust as sulfides, oxides or native elements, with widely varying abundance. For example, silicon occurs abundantly as oxide, while arsenic and antimony are mostly found as sulfides associated with metal ores.'},
    '非金屬':{zhHant:'以單質（如氧氣、氮氣、硫、碳）或化合物（如水、碳酸鹽、磷酸鹽）形式存在。它們是構成大氣、海洋與生物體的主要元素，分佈極為廣泛。',zhHans:'以单质（如氧气、氮气、硫、碳）或化合物（如水、碳酸盐、磷酸盐）形式存在。它们是构成大气、海洋与生物体的主要元素，分布极为广泛。',en:'Occurs as native elements (e.g., oxygen, nitrogen, sulfur, carbon) or compounds (e.g., water, carbonates, phosphates). They are the main elements of the atmosphere, oceans and living organisms, extremely widely distributed.'},
    '貧金屬':{zhHant:'多以硫化物或氧化物礦物形式存在，部分（如錫、鉍）也可見單質。它們在地殼中的丰度較低，常與其他金屬礦共生，需要複雜的冶煉過程提取。',zhHans:'多以硫化物或氧化物矿物形式存在，部分（如锡、铋）也可见单质。它们在地壳中的丰度较低，常与其他金属矿共生，需要复杂的冶炼过程提取。',en:'Mostly found as sulfide or oxide minerals; some (e.g., tin, bismuth) also occur natively. They are relatively scarce in the crust, often associated with other metal ores, and require complex smelting for extraction.'},
    '超重元素':{zhHant:'全部為人工合成，透過核反應與粒子加速器製備，半衰期極短，自然界不存在。它們只能在實驗室中合成極少量原子，存活時間通常只有幾毫秒到幾秒。',zhHans:'全部为人工合成，通过核反应与粒子加速器制备，半衰期极短，自然界不存在。它们只能在实验室中合成极少量原子，存活时间通常只有几毫秒到几秒。',en:'All synthetic, produced via nuclear reactions and particle accelerators; half-lives are extremely short and they do not occur in nature. Only a few atoms can be synthesised in the laboratory, typically surviving from milliseconds to seconds.'}
  };
  return (map[c]||map['過渡金屬'])[langKey];
}

function getUses(el, langKey){
  if(SPECIFIC[el.num] && SPECIFIC[el.num].uses && SPECIFIC[el.num].uses[langKey]) return SPECIFIC[el.num].uses[langKey];
  const c = el.cat;
  const map = {
    '鹼金屬':{zhHant:'鹼金屬及其化合物用於電池、玻璃、肥皂、肥料與有機合成；鈉、鉀的化合物也是重要的工業原料，例如食鹽與純鹼。此外，液態鈉在核反應爐中用作冷卻劑。',zhHans:'碱金属及其化合物用于电池、玻璃、肥皂、肥料与有机合成；钠、钾的化合物也是重要的工业原料，例如食盐与纯碱。此外，液态钠在核反应堆中用作冷却剂。',en:'Alkali metals and their compounds are used in batteries, glass, soap, fertilisers and organic synthesis; sodium and potassium compounds are important industrial feedstocks (e.g., table salt, soda ash). Liquid sodium is used as a nuclear reactor coolant.'},
    '鹼土金屬':{zhHant:'用於輕合金、耐火材料、水泥、煙火與生物醫學（如鈣、鎂補充劑）。鎂合金在航空與汽車工業中廣泛應用，而鈣化合物則是建築材料的重要成分。',zhHans:'用于轻合金、耐火材料、水泥、烟火与生物医学（如钙、镁补充剂）。镁合金在航空与汽车工业中广泛应用，而钙化合物则是建筑材料的重要成分。',en:'Used in light alloys, refractories, cement, fireworks and biomedicine (e.g., calcium and magnesium supplements). Magnesium alloys are widely used in aerospace and automotive industries, while calcium compounds are key construction materials.'},
    '過渡金屬':{zhHant:'廣泛用於結構材料、導電材料、催化劑、磁性材料與合金。例如鐵與鋁用於建築，銅用於電線，鉑、鈀用於汽車觸媒轉化器，鈦合金用於航空航天。',zhHans:'广泛用于结构材料、导电材料、催化剂、磁性材料与合金。例如铁与铝用于建筑，铜用于电线，铂、钯用于汽车触媒转化器，钛合金用于航空航天。',en:'Widely used in structural materials, conductors, catalysts, magnetic materials and alloys. For example, iron and aluminium in construction, copper in wiring, platinum and palladium in catalytic converters, and titanium alloys in aerospace.'},
    '鑭系':{zhHant:'用於強力磁鐵（釹鐵硼）、螢光粉、雷射、玻璃拋光與石油裂解催化劑。釹鐵硼磁鐵是目前磁性最強的永磁材料，廣泛應用於電動車與風力發電機。',zhHans:'用于强力磁铁（钕铁硼）、荧光粉、激光、玻璃抛光与石油裂解催化剂。钕铁硼磁铁是目前磁性最强的永磁材料，广泛应用于电动车与风力发电机。',en:'Used in strong magnets (NdFeB), phosphors, lasers, glass polishing and petroleum cracking catalysts. NdFeB magnets are the strongest permanent magnets currently known, widely used in electric vehicles and wind turbines.'},
    '錒系':{zhHant:'鈾、鈽用於核燃料與核武器；鋂用於煙霧探測器；釷被視為潛在核燃料。這些元素的應用與核能技術密切相關，同時也用於放射性示蹤與醫學研究。',zhHans:'铀、钚用于核燃料与核武器；镅用于烟雾探测器；钍被视为潜在核燃料。这些元素的应用与核能技术密切相关，同时也用于放射性示踪与医学研究。',en:'Uranium and plutonium for nuclear fuel and weapons; americium in smoke detectors; thorium as a potential nuclear fuel. Their applications are closely tied to nuclear technology, as well as radioactive tracing and medical research.'},
    '鹵素':{zhHant:'用於消毒、漂白、製藥、塑料（PVC）與攝影材料。氯是自來水消毒的關鍵化學品，碘用於消毒與甲狀腺健康，氟則用於牙膏與含氟聚合物。',zhHans:'用于消毒、漂白、制药、塑料（PVC）与摄影材料。氯是自来水消毒的关键化学品，碘用于消毒与甲状腺健康，氟则用于牙膏与含氟聚合物。',en:'Used in disinfection, bleaching, pharmaceuticals, plastics (PVC) and photographic materials. Chlorine is key for water disinfection, iodine for antiseptics and thyroid health, and fluorine in toothpaste and fluoropolymers.'},
    '稀有氣體':{zhHant:'用於照明、焊接保護、低溫冷卻、雷射與醫療（如氦氧混合氣）。氖用於霓虹燈，氬用於焊接保護，液氦用於超導磁鐵冷卻，氙可用於麻醉與車燈。',zhHans:'用于照明、焊接保护、低温冷却、激光与医疗（如氦氧混合气）。氖用于霓虹灯，氩用于焊接保护，液氦用于超导磁铁冷却，氙可用于麻醉与车灯。',en:'Used in lighting, welding shielding, cryogenic cooling, lasers and medicine (e.g., helium-oxygen mixtures). Neon in signs, argon in welding, liquid helium for superconducting magnets, and xenon in anaesthesia and headlights.'},
    '類金屬':{zhHant:'用於半導體、合金、玻璃與陶瓷；砷、銻等也用於農藥與阻燃劑（受嚴格管制）。矽是半導體工業的基石，鍺用於紅外光學與光纖，硼用於玻璃與陶瓷。',zhHans:'用于半导体、合金、玻璃与陶瓷；砷、锑等也用于农药与阻燃剂（受严格管制）。硅是半导体工业的基石，锗用于红外光学与光纤，硼用于玻璃与陶瓷。',en:'Used in semiconductors, alloys, glass and ceramics; arsenic and antimony are also used in pesticides and flame retardants (strictly regulated). Silicon is the cornerstone of the semiconductor industry, germanium for infrared optics and fibre optics, and boron in glass and ceramics.'},
    '非金屬':{zhHant:'用於化工、肥料、燃料、半導體與生物醫學等領域。氫用於合成氨，氧用於醫療與煉鋼，氮用於惰性氣氛保護，碳是燃料與有機化學的基礎。',zhHans:'用于化工、肥料、燃料、半导体与生物医学等领域。氢用于合成氨，氧用于医疗与炼钢，氮用于惰性气氛保护，碳是燃料与有机化学的基础。',en:'Used in chemicals, fertilisers, fuels, semiconductors and biomedicine. Hydrogen for ammonia synthesis, oxygen for medical use and steelmaking, nitrogen for inert atmospheres, and carbon as the basis of fuels and organic chemistry.'},
    '貧金屬':{zhHant:'用於合金、鍍層、焊料、電池與半導體（如鎵、銦）。鋁用於輕質結構材料，錫用於焊料與鍍錫鐵皮，銦用於觸控螢幕的透明導電層（ITO）。',zhHans:'用于合金、镀层、焊料、电池与半导体（如镓、铟）。铝用于轻质结构材料，锡用于焊料与镀锡铁皮，铟用于触摸屏的透明导电层（ITO）。',en:'Used in alloys, coatings, solders, batteries and semiconductors (e.g., gallium, indium). Aluminium for lightweight structures, tin for solders and tinplate, and indium for transparent conductive layers (ITO) in touchscreens.'},
    '超重元素':{zhHant:'目前僅供基礎科學研究，無實際應用。它們的合成有助於理解原子核的穩定性與化學性質的極限，並推動核物理學的發展。',zhHans:'目前仅供基础科学研究，无实际应用。它们的合成有助于理解原子核的稳定性与化学性质的极限，并推动核物理学的发展。',en:'Currently only for basic scientific research; no practical applications. Their synthesis helps understand the limits of nuclear stability and chemical properties, advancing nuclear physics.'}
  };
  return (map[c]||map['過渡金屬'])[langKey];
}

function getFunFact(el, langKey){
  if(SPECIFIC[el.num] && SPECIFIC[el.num].fact && SPECIFIC[el.num].fact[langKey]) return SPECIFIC[el.num].fact[langKey];
  const c = el.cat;
  const map = {
    '鹼金屬':{zhHant:'鹼金屬的焰色反應各具特色：鋰呈洋紅色、鈉呈黃色、鉀呈紫色、銣呈紫紅色、銫呈藍色。這些鮮豔的色彩常被用於煙火與焰色試驗中。',zhHans:'碱金属的焰色反应各具特色：锂呈洋红色、钠呈黄色、钾呈紫色、铷呈紫红色、铯呈蓝色。这些鲜艳的色彩常被用于烟火与焰色试验中。',en:'Alkali metals have distinctive flame colours: lithium crimson, sodium yellow, potassium violet, rubidium red-violet and caesium blue. These vivid colours are often used in fireworks and flame tests.'},
    '鹼土金屬':{zhHant:'鹼土金屬的焰色反應同樣鮮明：鈣呈橙紅色、鍶呈深紅色、鋇呈綠色，常用於煙火。鍶鹽是紅色煙火的主要發色劑。',zhHans:'碱土金属的焰色反应同样鲜明：钙呈橙红色、锶呈深红色、钡呈绿色，常用于烟火。锶盐是红色烟火的主要发色剂。',en:'Alkaline earth metals also give vivid flame colours: calcium orange-red, strontium crimson and barium green, widely used in fireworks. Strontium salts are the main colourant in red fireworks.'},
    '過渡金屬':{zhHant:'過渡金屬的化合物常因 d-d 電子躍遷而呈現豐富顏色，例如銅鹽呈藍色、鐵鹽呈黃或綠色、鉻鹽呈橙或綠色。許多寶石（如紅寶石、藍寶石）的顏色也來自過渡金屬離子。',zhHans:'过渡金属的化合物常因 d-d 电子跃迁而呈现丰富颜色，例如铜盐呈蓝色、铁盐呈黄或绿色、铬盐呈橙或绿色。许多宝石（如红宝石、蓝宝石）的颜色也来自过渡金属离子。',en:'Transition-metal compounds often show rich colours due to d-d electronic transitions, e.g., copper salts blue, iron salts yellow or green, chromium salts orange or green. Many gemstones (e.g., ruby, sapphire) derive their colour from transition-metal ions.'},
    '鑭系':{zhHant:'鑭系元素因 4f 電子躍遷而具有獨特的發光性質，是螢光粉與 LED 螢光材料的重要成分。銪用於紅色螢光粉，鋱用於綠色螢光粉，是彩色顯示技術的關鍵。',zhHans:'镧系元素因 4f 电子跃迁而具有独特的发光性质，是荧光粉与 LED 荧光材料的重要成分。铕用于红色荧光粉，铽用于绿色荧光粉，是彩色显示技术的关键。',en:'Lanthanides exhibit characteristic luminescence from 4f electron transitions and are key components of phosphors and LED materials. Europium is used in red phosphors and terbium in green phosphors, crucial to colour display technology.'},
    '錒系':{zhHant:'所有錒系元素都具有放射性，其中鈾是自然界中最重的天然元素。鈾的放射性衰變是地球內部熱量的重要來源之一。',zhHans:'所有锕系元素都具有放射性，其中铀是自然界中最重的天然元素。铀的放射性衰变是地球内部热量的重要来源之一。',en:'All actinides are radioactive; uranium is the heaviest naturally occurring element. The radioactive decay of uranium is one of the important sources of Earth\'s internal heat.'},
    '鹵素':{zhHant:'鹵素的顏色隨原子序增加而加深：氟淡黃、氯黃綠、溴紅棕、碘紫黑。碘在加熱時會直接昇華為紫色的美麗蒸氣。',zhHans:'卤素的颜色随原子序增加而加深：氟淡黄、氯黄绿、溴红棕、碘紫黑。碘在加热时会直接升华为紫色的美丽蒸气。',en:'Halogen colour deepens with atomic number: fluorine pale yellow, chlorine yellow-green, bromine red-brown, iodine purple-black. Iodine sublimes directly to a beautiful purple vapour when heated.'},
    '稀有氣體':{zhHant:'稀有氣體在放電管中會發出特有色光：氖呈橙紅、氬呈藍紫、氪呈淡紫、氙呈藍白，常用於霓虹燈。霓虹燈的英文 neon light 即源自氖。',zhHans:'稀有气体在放电管中会发出特有色光：氖呈橙红、氩呈蓝紫、氪呈淡紫、氙呈蓝白，常用于霓虹灯。霓虹灯的英文 neon light 即源自氖。',en:'Noble gases emit characteristic colours in discharge tubes: neon orange-red, argon blue-violet, krypton pale violet, xenon blue-white, used in neon signs. The word "neon light" comes directly from neon.'},
    '類金屬':{zhHant:'類金屬常被用作半導體材料，矽與鍺是現代電子工業的基石。高純度矽的製備技術推動了電腦與手機的微型化革命。',zhHans:'类金属常被用作半导体材料，硅与锗是现代电子工业的基石。高纯度硅的制备技术推动了电脑与手机的微型化革命。',en:'Metalloids are often used as semiconductors; silicon and germanium are the foundation of the modern electronics industry. High-purity silicon production has driven the miniaturisation revolution in computers and phones.'},
    '非金屬':{zhHant:'非金屬涵蓋了宇宙中最豐富的元素（氫、氧、碳），也是生命化學的基礎。碳能形成數以百萬計的有機化合物，是生命多樣性的根源。',zhHans:'非金属涵盖了宇宙中最丰富的元素（氢、氧、碳），也是生命化学的基础。碳能形成数以百万计的有机化合物，是生命多样性的根源。',en:'Nonmetals include the most abundant elements in the universe (hydrogen, oxygen, carbon) and form the basis of life chemistry. Carbon can form millions of organic compounds, the root of life\'s diversity.'},
    '貧金屬':{zhHant:'鎵的熔點僅約 29.8°C，握在手中即可熔化；銦錫氧化物（ITO）是觸控螢幕的透明導電層。鉍的晶體具有獨特的彩虹色階梯狀結構。',zhHans:'镓的熔点仅约 29.8°C，握在手中即可熔化；铟锡氧化物（ITO）是触摸屏的透明导电层。铋的晶体具有独特的彩虹色阶梯状结构。',en:'Gallium melts at only about 29.8°C, so it melts in your hand; indium tin oxide (ITO) is the transparent conductive layer in touchscreens. Bismuth crystals have a distinctive iridescent stair-step structure.'},
    '超重元素':{zhHant:'超重元素的半衰期通常極短，但它們的存在驗證了核物理理論與「穩定島」假說。科學家仍在尋找壽命更長的超重元素同位素。',zhHans:'超重元素的半衰期通常极短，但它们的存在验证了核物理理论与“稳定岛”假说。科学家仍在寻找寿命更长的超重元素同位素。',en:'Superheavy elements usually have extremely short half-lives, but their existence tests nuclear theory and the "island of stability" hypothesis. Scientists continue to search for longer-lived superheavy isotopes.'}
  };
  return (map[c]||map['過渡金屬'])[langKey];
}

   6. 安全警示

  const sym = el.sym;
  const specific = {
    'Hg':{
      'zhHant':'口服 1 克金屬汞本身吸收率極低，但若在體內氧化或攝入的是可溶性汞鹽（如氯化汞），0.5–1 克即可致死。金屬汞蒸氣吸入同樣致命。此處的「1 克單質」若為液態汞，主要危險在於長期蒸氣暴露與可能的氧化產物。無論如何，汞的任何形態都具強烈神經毒性，禁止吞食。',

      'en':'Ingesting 1 g of liquid mercury metal itself has very low absorption, but if oxidised in the body or consumed as a soluble mercury salt (e.g., mercuric chloride), 0.5–1 g can be fatal. Inhaling mercury vapour is also lethal. The main danger of 1 g of elemental liquid mercury lies in chronic vapour exposure and possible oxidation products. All forms of mercury are strongly neurotoxic; never ingest.'

    'Tl':{
      'zhHant':'鉈的成人致死量不足 1 克（約 0.6 克即可致命）。口服 1 克鉈鹽會迅速經消化道吸收，模擬鉀離子進入細胞，攻擊中樞與周圍神經系統，引發劇烈神經痛、脫髮、多器官衰竭，死亡可能在數天內發生。',
      'zhHans':'铊的成人致死量不足 1 克（约 0.6 克即可致命）。口服 1 克铊盐会迅速经消化道吸收，模拟钾离子进入细胞，攻击中枢与周围神经系统，引发剧烈神经痛、脱发、多器官衰竭，死亡可能在数天内发生。',
      'en':'The lethal dose of thallium for an adult is less than 1 g (about 0.6 g can be fatal). Ingesting 1 g of a thallium salt is rapidly absorbed through the gastrointestinal tract, mimics potassium ions to enter cells, attacks the central and peripheral nervous systems, causing severe neuralgia, hair loss and multi-organ failure; death can occur within days.'

      'zhHant':'鈉遇水劇烈反應。口腔與胃中充滿水分與黏液，吞下 1 克金屬鈉會在黏膜表面瞬間生成氫氧化鈉（強鹼）與氫氣，造成爆炸性局部反應、深度化學灼傷、食道與胃穿孔，並可能因氫氣積聚引發氣胸或栓塞。極度危險，可迅速致死。',
      'zhHans':'钠遇水剧烈反应。口腔与胃中充满水分与黏液，吞下 1 克金属钠会在黏膜表面瞬间生成氢氧化钠（强碱）与氢气，造成爆炸性局部反应、深度化学灼伤、食道与胃穿孔，并可能因氢气积聚引发气胸或栓塞。极度危险，可迅速致死。',
      'en':'Sodium reacts violently with water. The mouth and stomach are filled with water and mucus; swallowing 1 g of sodium metal would instantly generate sodium hydroxide (strong alkali) and hydrogen gas on the mucosal surface, causing explosive local reactions, deep chemical burns, oesophageal and gastric perforation, and potentially pneumothorax or embolism from accumulated hydrogen. Extremely dangerous and can be rapidly fatal.'
    },
    'As':{
      'zhHant':'無機砷的成人致死量約為 0.06–0.2 克（三氧化二砷，砒霜）。口服 1 克遠超致死劑量，會引發劇烈嘔吐、腹痛、血性腹瀉、心血管崩潰，死亡可能在數小時至數天內發生。',
      'zhHans':'无机砷的成人致死量约为 0.06–0.2 克（三氧化二砷，砒霜）。口服 1 克远超致死剂量，会引发剧烈呕吐、腹痛、血性腹泻、心血管崩溃，死亡可能在数小时至数天内发生。',
      'en':'The lethal dose of inorganic arsenic for an adult is about 0.06–0.2 g (arsenic trioxide, white arsenic). Ingesting 1 g far exceeds the fatal dose, causing severe vomiting, abdominal pain, bloody diarrhoea and cardiovascular collapse; death can occur within hours to days.'
    },
    'Pb':{
      'zhHant':'口服 1 克可溶性鉛鹽會引起急性鉛中毒：口腔金屬味、劇烈腹絞痛（鉛疝痛）、嘔吐、便秘或腹瀉，隨後可能出現貧血、腎損傷與腦病。雖然急性致死不如砷、鉈迅速，但 1 克是極高劑量，必須立即就醫。',
      'zhHans':'口服 1 克可溶性铅盐会引起急性铅中毒：口腔金属味、剧烈腹绞痛（铅疝痛）、呕吐、便秘或腹泻，随后可能出现贫血、肾损伤与脑病。虽然急性致死不如砷、铊迅速，但 1 克是极高剂量，必须立即就医。',
      'en':'Ingesting 1 g of soluble lead salts causes acute lead poisoning: metallic taste, severe abdominal colic (lead colic), vomiting, constipation or diarrhoea, followed by anaemia, kidney injury and encephalopathy. Although less rapidly fatal than arsenic or thallium, 1 g is an extremely high dose and requires immediate medical attention.'
    }
  };
  if(specific[sym] && specific[sym][langKey]) return specific[sym][langKey];

  const radioactive = ['Tc','Po','At','Rn','Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf','Es','Fm','Md','No','Lr','Rf','Db','Sg','Bh','Hs','Mt','Ds','Rg','Cn','Nh','Fl','Mc','Lv','Ts','Og'];
  if(radioactive.includes(sym)) return t.safetyRadioactive;
  if(el.cat==='稀有氣體') return t.safetyNoble;
  if(el.cat==='鹼金屬') return t.safetyAlkali;
  if(el.cat==='鹵素') return t.safetyHalogen;
  if(['Cd','Be','Ba','Cr','Ni','Co','Cu','Zn','Mn','V','Sb','Sn','Bi'].includes(sym)) return t.safetyHeavyMetal;
  return t.safetyTemplate;
}

/* ============================================================
   7. 轉盤繪製與旋轉
   ============================================================ */
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;
const CX = CW/2, CY = CH/2, R = CW/2 - 18;

let rotation = 0;
let spinning = false;

const COLORS = ELEMENTS.map(e=>e.color);
const N = 118;

function shadeColor(hex, factor){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const f = Math.min(1, Math.max(0, factor));
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

function drawWheel(){
  ctx.clearRect(0,0,CW,CH);
  const seg = (Math.PI*2)/N;

  for(let i=0;i<N;i++){
    const start = i*seg + rotation;
    const end = start + seg;
    ctx.beginPath();
    ctx.moveTo(CX,CY);
    ctx.arc(CX,CY,R,start,end);
    ctx.closePath();
    const base = COLORS[i];
    ctx.fillStyle = shadeColor(base, i%2===0 ? 0.55 : 0.38);
    ctx.fill();
    ctx.strokeStyle = 'rgba(10,14,23,.55)';
    ctx.lineWidth = 0.7;
    ctx.stroke();

    const mid = start + seg/2;
    ctx.save();
    ctx.translate(CX,CY);
    ctx.rotate(mid);
    const textR = R - 8;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px "Segoe UI",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.fillText(ELEMENTS[i].sym, textR - 22, 0);
    ctx.font = '10px "Segoe UI",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText(ELEMENTS[i].num, textR - 2, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(CX,CY,R+6,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(34,211,238,.25)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function spin(){
  if(spinning) return;
  spinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  document.getElementById('wheelStatus').textContent = I18N[currentLang].spinning;

  let targetNum;
  if(window.crypto && window.crypto.getRandomValues){
    const arr = new Uint32Array(1);
    window.crypto.getRandomValues(arr);
    targetNum = (arr[0] % 118) + 1;
  }else{
    targetNum = Math.floor(Math.random()*118)+1;
  }

  const seg = (Math.PI*2)/N;
  const targetCenter = (targetNum-1)*seg + seg/2;
  const pointerAngle = -Math.PI/2;
  const baseRotation = pointerAngle - targetCenter;
  const extraTurns = 8 + Math.floor(Math.random()*5);
  const finalRotation = baseRotation + extraTurns*Math.PI*2 + (Math.random()-0.5)*seg*0.25;

  const startRotation = rotation;
  const delta = finalRotation - startRotation;
  const duration = 4200 + Math.random()*800;
  const t0 = performance.now();

  function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }

  function step(now){
    const elapsed = now - t0;
    const p = Math.min(1, elapsed/duration);
    const eased = easeOutCubic(p);
    rotation = startRotation + delta*eased;
    drawWheel();
    if(p < 1){
      requestAnimationFrame(step);
    }else{
      rotation = finalRotation % (Math.PI*2);
      drawWheel();
      spinning = false;
      btn.disabled = false;
      document.getElementById('wheelStatus').textContent = '';
      setTimeout(()=>{ showDetail(targetNum); }, 450);
    }
  }
  requestAnimationFrame(step);
}

/* ============================================================
   8. 詳情頁渲染
   ============================================================ */
let currentLang = 'zh-Hant';
let currentResultNum = null;

function showDetail(num){
  currentResultNum = num;
  const el = byNum.get(num);
  
  // 語言鍵值轉換：'zh-Hant' -> 'zhHant', 'zh-Hans' -> 'zhHans', 'en' -> 'en'
  const langKey = currentLang === 'zh-Hant' ? 'zhHant' : (currentLang === 'zh-Hans' ? 'zhHans' : 'en');
  const t = I18N[currentLang];
  
  const name = currentLang==='zh-Hant' ? el.zhHant : currentLang==='zh-Hans' ? el.zhHans : el.en;
  const otherName = currentLang==='en' ? el.zhHant : el.en;
  const massStr = Array.isArray(el.mass) ? `[${el.mass[0]}]` : el.mass;
  const catName = currentLang==='en' ? (CAT_EN[el.cat]||el.cat) : el.cat;

  const stateMap = {
    gas:{zhHant:'氣態（Gas）',zhHans:'气态（Gas）',en:'Gas'},
    liquid:{zhHant:'液態（Liquid）',zhHans:'液态（Liquid）',en:'Liquid'},
    solid:{zhHant:'固態（Solid）',zhHans:'固态（Solid）',en:'Solid'}
  };
  const stateText = stateMap[stateOf(el)][langKey];

  const appearance = getAppearance(el, langKey);
  const meltHint = getMeltingBoilingHint(el, langKey);
  const densityHint = getDensityHint(el, langKey);
  const chemistry = getChemistry(el, langKey);
  const occurrence = getOccurrence(el, langKey);
  const uses = getUses(el, langKey);
  const funFact = getFunFact(el, langKey);

  let compText = t.noCompounds;
  const c = COMPOUNDS[num];
  if(c && c[currentLang]) compText = c[currentLang];

  let historyText = '';
  if(currentLang==='en'){
    historyText = el.discovery === '古代' ? 'Known since ancient times, this element has been used by humans for thousands of years in various practical and cultural applications.' : `Discovered in ${el.discovery.split('·')[0]} by ${el.discovery.split('·')[1]||'unknown'}, this finding marked an important milestone in the development of modern chemistry.`;
  }else if(currentLang==='zh-Hans'){
    historyText = el.discovery === '古代' ? '自古已知，人类在数千年的历史长河中已将其广泛应用于生活与生产之中，对早期文明的发展产生了深远影响。' : `${el.discovery.split('·')[0]}年，由${el.discovery.split('·')[1]||'未知'}首次发现并确认，这一重大发现推动了当时化学理论与工业的迅速发展。`;
  }else{
    historyText = el.discovery === '古代' ? '自古已知，人類在數千年的歷史長河中已將其廣泛應用於生活與生產之中，對早期文明的發展產生了深遠影響。' : `${el.discovery.split('·')[0]}年，由${el.discovery.split('·')[1]||'未知'}首次發現並確認，這一重大發現推動了當時化學理論與工業的迅速發展。`;
  }

  const safety = getSafety(el, langKey);

  const html = `
    <div class="detail-top">
      <div class="element-hero">
        <div class="element-badge" style="background:linear-gradient(135deg,${el.color}44,${el.color}22); border:1px solid ${el.color}66;">
          <div class="num">${el.num}</div>
          <div class="sym" style="color:${el.color}">${el.sym}</div>
        </div>
        <div class="element-name-block">
          <h2>${name}</h2>
          <div class="en">${otherName} · ${el.sym}</div>
          <div class="element-tags">
            <span class="tag" style="border-color:${el.color}55; color:${el.color}; background:${el.color}12;">${catName}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="label">${t.number}</div><div class="value">${el.num}</div></div>
      <div class="stat-card"><div class="label">${t.atomicMass}</div><div class="value">${massStr} <small>g/mol</small></div></div>
      <div class="stat-card"><div class="label">${t.category}</div><div class="value" style="font-size:14px;">${catName}</div></div>
      <div class="stat-card"><div class="label">${t.discovery}</div><div class="value" style="font-size:14px;">${el.discovery}</div></div>
    </div>

    <div class="section-block">
      <h3>◈ ${t.physicalTitle}</h3>
      <div class="bullet"><span class="dot">•</span><span><b>${t.stateLabel}：</b>${stateText}</span></div>
      <div class="bullet"><span class="dot">•</span><span><b>${t.appearanceLabel}：</b>${appearance}</span></div>
      <div class="bullet"><span class="dot">•</span><span><b>${t.meltingLabel}：</b>${meltHint}</span></div>
      <div class="bullet"><span class="dot">•</span><span><b>${t.densityLabel}：</b>${densityHint}</span></div>
    </div>

    <div class="section-block">
      <h3>◈ ${t.chemistryTitle}</h3>
      <p>${chemistry}</p>
    </div>

    <div class="section-block">
      <h3>◈ ${t.occurrenceTitle}</h3>
      <div class="mini-label">${t.distributionLabel}</div>
      <p>${occurrence}</p>
      <div class="mini-label" style="margin-top:12px;">${t.usesLabel}</div>
      <p>${uses}</p>
    </div>

    <div class="section-block">
      <h3>◈ ${t.factTitle}</h3>
      <p>${funFact}</p>
    </div>

    <div class="section-block">
      <h3>◈ ${t.historyTitle}</h3>
      <p>${historyText}</p>
    </div>

    <div class="section-block">
      <h3>◈ ${t.compoundsTitle}</h3>
      <p>${compText}</p>
    </div>

    <div class="danger-block">
      <h3>☠ ${t.safetyTitle}</h3>
      <p><span class="warn-label">${t.safetyWarn}</span>${safety}</p>
    </div>

    <button class="again-btn" id="againBtn">${t.again}</button>
  `;

  document.getElementById('detailContent').innerHTML = html;
  
  // 隐藏其他所有页面，显示详情页
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('detailPage').classList.add('active');
  document.getElementById('detailPage').scrollTop = 0;
  
  // 隐藏语言切换栏
  document.getElementById('langBar').style.display = 'none';

  document.getElementById('againBtn').addEventListener('click', ()=>{
    document.getElementById('detailPage').classList.remove('active');
    document.getElementById('wheelPage').classList.add('active');
    document.getElementById('langBar').style.display = '';
    document.getElementById('wheelPage').scrollTop = 0;
  });
}

/* ============================================================
   9. 頁面與語言控制
   ============================================================ */
function applyLanguage(lang){
  currentLang = lang;
  const t = I18N[lang];
  document.getElementById('i18nTitle').textContent = t.title;
  document.getElementById('i18nSubtitle').textContent = t.subtitle;
  document.getElementById('i18nHint').textContent = t.hint;
  document.getElementById('startBtn').textContent = t.start;
  document.getElementById('spinBtn').textContent = t.spin;
  document.querySelectorAll('#langBar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  if(currentResultNum && document.getElementById('detailPage').classList.contains('active')){
    showDetail(currentResultNum);
  }
}

document.getElementById('langBar').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  applyLanguage(btn.dataset.lang);
});

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('startPage').classList.remove('active');
  document.getElementById('wheelPage').classList.add('active');
  drawWheel();
});

document.getElementById('spinBtn').addEventListener('click', spin);

// 點擊輪盤即可開始轉動
document.getElementById('wheelWrap').addEventListener('click', ()=>{
  if(!document.getElementById('wheelPage').classList.contains('active')) return;
  if(spinning) return;
  spin();
});

/* ============================================================
   10. 初始化
   ============================================================ */
applyLanguage('zh-Hant');
drawWheel();
</script>
