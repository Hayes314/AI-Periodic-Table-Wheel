<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>元素週期輪盤 · Periodic Table Wheel</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#111827; --panel2:#1a2332;
    --text:#e5e7eb; --muted:#9ca3af; --accent:#22d3ee;
    --danger:#ef4444; --ok:#34d399;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans TC','Noto Sans SC',sans-serif;}
  #app{height:100%; width:100%; position:relative;}

  #langBar{position:fixed; top:12px; right:12px; z-index:100; display:flex; gap:6px; background:rgba(0,0,0,.55);
    padding:5px; border-radius:12px; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.08);}
  #langBar button{background:transparent; border:none; color:var(--muted); font-size:12px; padding:6px 10px;
    border-radius:8px; cursor:pointer; font-weight:600; letter-spacing:.3px; transition:.2s;}
  #langBar button.active{background:var(--accent); color:#0a0e17;}
  #langBar button:hover:not(.active){color:#fff; background:rgba(255,255,255,.08);}

  .page{position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; padding:20px; opacity:0; transition:opacity .45s ease; overflow:hidden; z-index:1;}
  .page.active{display:flex; opacity:1; z-index:10;}

  #startPage{background:radial-gradient(ellipse at 50% 30%,#152238 0%,#0a0e17 70%);}
  .title-block{text-align:center; margin-bottom:36px; z-index:2;}
  .title-block h1{font-size:clamp(28px,5vw,52px); margin:0 0 8px; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg,#22d3ee,#a78bfa,#f472b6); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent;}
  .title-block p{color:var(--muted); font-size:clamp(13px,1.8vw,16px); margin:0; max-width:560px; line-height:1.6;}
  .start-btn{padding:16px 52px; font-size:18px; font-weight:800; border:none; border-radius:60px; cursor:pointer;
    background:linear-gradient(135deg,#22d3ee,#3b82f6); color:#04121f; letter-spacing:.5px;
    box-shadow:0 0 40px rgba(34,211,238,.35); transition:.25s; z-index:2;}
  .start-btn:hover{transform:translateY(-2px) scale(1.02); box-shadow:0 0 60px rgba(34,211,238,.55);}
  .start-btn:active{transform:scale(.97);}
  .start-hint{margin-top:18px; font-size:12px; color:var(--muted); opacity:.7; z-index:2;}

  #wheelPage{background:radial-gradient(ellipse at 50% 40%,#111b2b 0%,#0a0e17 75%); gap:18px;}
  #wheelWrap{position:relative; width:min(82vmin,520px); height:min(82vmin,520px); flex-shrink:0; cursor:pointer;}
  #wheelCanvas{width:100%; height:100%; display:block; border-radius:50%;
    box-shadow:0 0 0 2px rgba(34,211,238,.15), 0 0 60px rgba(0,0,0,.7), inset 0 0 80px rgba(0,0,0,.5);}
  #pointer{position:absolute; top:-6px; left:50%; transform:translateX(-50%); z-index:5;
    width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent;
    border-top:34px solid var(--accent); filter:drop-shadow(0 2px 6px rgba(34,211,238,.6)); pointer-events:none;}
  #centerHub{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:4;
    width:clamp(64px,12vmin,90px); height:clamp(64px,12vmin,90px); border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#1e293b,#0f172a); border:3px solid rgba(34,211,238,.4);
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 30px rgba(0,0,0,.8), inset 0 0 20px rgba(0,0,0,.6);
    pointer-events:none;}
  #centerHub span{font-size:clamp(22px,4.5vmin,34px); filter:drop-shadow(0 0 8px rgba(34,211,238,.5));}

  #spinBtn{padding:16px 56px; font-size:clamp(16px,2.4vw,20px); font-weight:800; border:none; border-radius:60px;
    cursor:pointer; background:linear-gradient(135deg,#f59e0b,#ef4444); color:#fff; letter-spacing:.5px;
    box-shadow:0 8px 32px rgba(239,68,68,.4); transition:.2s; z-index:10;}
  #spinBtn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 12px 40px rgba(239,68,68,.55);}
  #spinBtn:active:not(:disabled){transform:scale(.97);}
  #spinBtn:disabled{opacity:.35; cursor:not-allowed; filter:grayscale(.5);}
  #wheelStatus{font-size:13px; color:var(--muted); height:20px; letter-spacing:.4px;}

  #detailPage{justify-content:flex-start; overflow-y:auto; padding:0; background:var(--bg);}
  #detailPage.active{display:block;}
  .detail-scroll{max-width:900px; margin:0 auto; padding:32px 22px 40px; min-height:100%;}
  .detail-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:8px; flex-wrap:wrap;}
  .element-hero{display:flex; align-items:center; gap:18px;}
  .element-badge{width:76px; height:76px; border-radius:18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-weight:800; line-height:1.1; flex-shrink:0;}
  .element-badge .num{font-size:12px; opacity:.8; font-weight:600;}
  .element-badge .sym{font-size:30px;}
  .element-name-block h2{margin:0; font-size:clamp(24px,3.5vw,34px); font-weight:800;}
  .element-name-block .en{color:var(--muted); font-size:15px; font-weight:500;}
  .element-tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .tag{font-size:11px; padding:3px 10px; border-radius:20px; background:rgba(34,211,238,.12);
    color:var(--accent); border:1px solid rgba(34,211,238,.25); font-weight:600;}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:22px 0;}
  .stat-card{background:var(--panel); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:14px 16px;}
  .stat-card .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:4px;}
  .stat-card .value{font-size:17px; font-weight:700;}
  .stat-card .value small{font-size:12px; color:var(--muted); font-weight:500;}

  .section-block{background:var(--panel); border:1px solid rgba(255,255,255,.06); border-radius:16px;
    padding:20px 22px; margin-bottom:14px;}
  .section-block h3{margin:0 0 12px; font-size:15px; color:var(--accent); letter-spacing:.5px;
    display:flex; align-items:center; gap:8px;}
  .section-block p{margin:0 0 10px; font-size:14px; line-height:1.75; color:#cbd5e1;}
  .section-block p:last-child{margin-bottom:0;}
  .section-block .bullet{display:flex; gap:10px; margin-bottom:10px; font-size:14px; line-height:1.7; color:#cbd5e1;}
  .section-block .bullet:last-child{margin-bottom:0;}
  .section-block .bullet .dot{color:var(--accent); flex-shrink:0; font-weight:800;}
  .section-block .mini-label{display:inline-block; font-size:11px; font-weight:700; color:var(--accent);
    background:rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.2); padding:2px 9px;
    border-radius:6px; margin-bottom:8px; letter-spacing:.5px;}

  .danger-block{background:linear-gradient(135deg,rgba(127,29,29,.35),rgba(69,10,10,.45));
    border:1px solid rgba(239,68,68,.35); border-radius:16px; padding:20px 22px; margin-bottom:18px;}
  .danger-block h3{margin:0 0 12px; font-size:15px; color:#fca5a5; letter-spacing:.5px;}
  .danger-block p{margin:0; font-size:14px; line-height:1.8; color:#fecaca;}
  .danger-block .warn-label{display:inline-block; font-size:10px; font-weight:800; letter-spacing:1px;
    background:var(--danger); color:#fff; padding:2px 8px; border-radius:4px; margin-right:8px; vertical-align:middle;}

  .again-btn{display:block; width:100%; max-width:420px; margin:26px auto 0; padding:16px;
    font-size:17px; font-weight:800; border:none; border-radius:60px; cursor:pointer;
    background:linear-gradient(135deg,#22d3ee,#3b82f6); color:#04121f; letter-spacing:.5px;
    box-shadow:0 8px 30px rgba(34,211,238,.3); transition:.2s;}
  .again-btn:hover{transform:translateY(-2px); box-shadow:0 12px 40px rgba(34,211,238,.45);}
  .again-btn:active{transform:scale(.97);}

  @media (max-width:520px){
    .detail-scroll{padding:24px 14px 32px;}
    .element-badge{width:62px;height:62px;}
    .element-badge .sym{font-size:24px;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    #spinBtn{padding:14px 40px;}
  }
</style>
</head>
<body>

    <div id="wheelStatus"></div>
  </section>

  <section id="detailPage" class="page">
    <div class="detail-scroll" id="detailContent"></div>
  </section>
</div>

const DETAILS = {
  1:{z:{a:"常溫常壓下為無色、無味、無臭的雙原子氣體，密度極低，是宇宙中最輕的氣體，極難液化。",c:"具有極強的還原性，能與氧氣劇烈反應甚至爆炸。在常溫下較穩定，但與氟、氯等強氧化劑接觸會劇烈反應，生成氫化物。",o:"宇宙中最豐富的元素，約佔普通物質質量的75%。地球上主要以水、有機物形式存在，大氣中含量極微，工業上多從天然氣中提取。",u:"用於合成氨（哈伯法）、石油精煉、甲醇生產及燃料電池。液氫是火箭燃料，氘和氚用於核融合研究。",f:"氫是唯一沒有中子的元素，其同位素氘和氚在核融合研究中扮演核心角色，也是未來清潔能源的希望。",s:"氫氣本身無毒，但大量吸入會導致缺氧窒息。液氫極低溫會造成嚴重凍傷。與空氣混合遇火源會發生劇烈爆炸。"},h:{a:"常温常压下为无色、无味、无臭的双原子气体，密度极低，是宇宙中最轻的气体，极难液化。",c:"具有极强的还原性，能与氧气剧烈反应甚至爆炸。在常温下较稳定，但与氟、氯等强氧化剂接触会剧烈反应，生成氢化物。",o:"宇宙中最丰富的元素，约占普通物质质量的75%。地球上主要以水、有机物形式存在，大气中含量极微，工业上多从天然气中提取。",u:"用于合成氨（哈伯法）、石油精炼、甲醇生产及燃料电池。液氢是火箭燃料，氘和氚用于核聚变研究。",f:"氢是唯一没有中子的元素，其同位素氘和氚在核聚变研究中扮演核心角色，也是未来清洁能源的希望。",s:"氢气本身无毒，但大量吸入会导致缺氧窒息。液氢极低温会造成严重冻伤。与空气混合遇火源会发生剧烈爆炸。"},e:{a:"A colourless, odourless, tasteless diatomic gas with extremely low density, the lightest gas in the universe and very difficult to liquefy.",c:"A strong reducing agent that reacts violently with oxygen. Stable at room temperature but reacts vigorously with strong oxidisers like fluorine and chlorine, forming hydrides.",o:"The most abundant element in the universe (~75% by mass). On Earth, it mainly exists as water and organic matter, with trace amounts in the atmosphere, extracted from natural gas.",u:"Used in ammonia synthesis, petroleum refining, methanol production, and fuel cells. Liquid hydrogen is rocket fuel; deuterium and tritium are used in fusion research.",f:"Hydrogen is the only element without a neutron; its isotopes deuterium and tritium are central to fusion research and hold the promise of future clean energy.",s:"Hydrogen gas is non-toxic but can cause asphyxiation in high concentrations. Liquid hydrogen causes severe frostbite. Explosive when mixed with air and ignited."}},
  2:{z:{a:"無色、無味、無臭的單原子惰性氣體，是唯一在常溫常壓下無法固化的元素，具有極高的熱傳導性。",c:"化學性質極不活潑，幾乎不與任何元素反應，以單原子分子形式穩定存在。在極端條件下可形成少數不穩定化合物。",o:"宇宙中第二豐富的元素（約24%），地球大氣中含量約0.00052%，主要來自天然氣田和放射性衰變，可從天然氣中分離提取。",u:"用於低溫超導磁鐵冷卻、深海潛水混合氣、氣球與飛艇填充、焊接保護氣及半導體製造。",f:"液氦在接近絕對零度時會展現出超流動性，能沿著容器壁向上攀爬，是低溫物理學中的奇蹟現象。",s:"氦氣本身無毒，但大量吸入會排擠氧氣導致缺氧窒息。高壓氣瓶操作不當可能造成嚴重的物理傷害。"},h:{a:"无色、无味、无臭的单原子惰性气体，是唯一在常温常压下无法固化的元素，具有极高的热传导性。",c:"化学性质极不活泼，几乎不与任何元素反应，以单原子分子形式稳定存在。在极端条件下可形成少数不稳定化合物。",o:"宇宙中第二丰富的元素（约24%），地球大气中含量约0.00052%，主要来自天然气田和放射性衰变，可从天然气中分离提取。",u:"用于低温超导磁铁冷却、深海潜水混合气、气球与飞艇填充、焊接保护气及半导体制造。",f:"液氦在接近绝对零度时会展现出超流动性，能沿着容器壁向上攀爬，是低温物理学中的奇迹现象。",s:"氦气本身无毒，但大量吸入会排挤氧气导致缺氧窒息。高压气瓶操作不当可能造成严重的物理伤害。"},e:{a:"A colourless, odourless, tasteless monatomic gas; the only element that cannot solidify at normal pressure, with very high thermal conductivity.",c:"Extremely inert chemically, virtually non-reactive with any element, existing stably as monatomic molecules. Under extreme conditions, forms a few unstable compounds.",o:"The second most abundant element in the universe (~24%). Earth's atmosphere contains ~0.00052%, mainly from natural gas and radioactive decay, extracted from natural gas.",u:"Used for cooling superconducting magnets, deep-sea breathing mixtures, balloon inflation, welding shielding gas, and semiconductor manufacturing.",f:"Liquid helium exhibits superfluidity near absolute zero, climbing up container walls, a miraculous phenomenon in low-temperature physics.",s:"Helium is non-toxic but can cause asphyxiation by displacing oxygen. High-pressure cylinders pose physical hazards if mishandled."}},
  3:{z:{a:"銀白色、質地極軟的金屬，可用小刀輕易切開，是所有金屬中密度最小的，密度僅為水的一半。",c:"活性極高，遇水劇烈反應生成氫氧化鋰和氫氣，在空氣中會迅速氧化變暗。必須儲存在礦物油或惰性氣體中。",o:"不以單質存在，主要存在於鋰輝石、鋰雲母與鹽湖滷水中，地殼丰度約0.002%，南美洲的鹽湖是主要產地。",u:"鋰離子電池的核心材料，廣泛應用於電動車與電子產品，也用於陶瓷、玻璃、潤滑脂及情緒穩定藥物。",f:"鋰是密度最小的金屬，密度僅約0.53 g/cm³，可浮在水面上劇烈反應，其電池技術徹底改變了現代可攜式電子設備。",s:"口服金屬鋰會與胃酸劇烈反應產生氫氣，造成胃穿孔；可溶性鋰鹽會導致中樞神經中毒，引發震顫、昏迷甚至死亡。"},h:{a:"银白色、质地极软的金属，可用小刀轻易切开，是所有金属中密度最小的，密度仅为水的一半。",c:"活性极高，遇水剧烈反应生成氢氧化锂和氢气，在空气中会迅速氧化变暗。必须储存在矿物油或惰性气体中。",o:"不以单质存在，主要存在于锂辉石、锂云母与盐湖卤水中，地壳丰度约0.002%，南美洲的盐湖是主要产地。",u:"锂离子电池的核心材料，广泛应用于电动车与电子产品，也用于陶瓷、玻璃、润滑脂及情绪稳定药物。",f:"锂是密度最小的金属，密度仅约0.53 g/cm³，可浮在水面上剧烈反应，其电池技术彻底改变了现代可携带式电子设备。",s:"口服金属锂会与胃酸剧烈反应产生氢气，造成胃穿孔；可溶性锂盐会导致中枢神经中毒，引发震颤、昏迷甚至死亡。"},e:{a:"A silvery-white, extremely soft metal that can be easily cut with a knife; the least dense of all metals, half the density of water.",c:"Highly reactive; reacts violently with water to form lithium hydroxide and hydrogen gas, and tarnishes rapidly in air. Must be stored under oil or inert gas.",o:"Never found free; mainly found in spodumene, lepidolite, and salt-lake brines. Crustal abundance ~0.002%; South American salt flats are a major source.",u:"Core material for lithium-ion batteries in EVs and electronics; also used in ceramics, glass, lubricants, and mood-stabilising medication.",f:"Lithium is the least dense metal (~0.53 g/cm³) and floats on water while reacting violently. Its battery technology revolutionised portable electronics.",s:"Ingesting lithium metal reacts violently with stomach acid producing hydrogen gas, causing perforation; soluble salts cause CNS toxicity, tremors, coma and death."}},
  4:{z:{a:"鋼灰色、質地堅硬且質輕的金屬，具有高熔點和良好的導熱性，對X射線具有極高的穿透性。",c:"表面易形成鈍化膜，化學性質相對穩定。但其粉塵和可溶性鹽類具有極強的毒性，屬於高危致癌物。",o:"主要存在於綠柱石、金綠寶石等礦物中，地殼丰度較低，開採和提煉過程需要嚴格的安全防護。",u:"用於航太合金、X光窗口、核反應爐中子反射體、高階音響揚聲器及精密儀器零件。",f:"鈹的毒性極強，吸入鈹粉塵會引發無法根治的鈹肺病，因此在工業應用中必須配備極其嚴格的防護措施。",s:"可溶性鈹鹽的致死量極低，口服會引發嚴重的胃腸炎、器官衰竭。長期接觸會導致肺部纖維化和肺癌。"},h:{a:"钢灰色、质地坚硬且质轻的金属，具有高熔点和良好的导热性，对X射线具有极高的穿透性。",c:"表面易形成钝化膜，化学性质相对稳定。但其粉尘和可溶性盐类具有极强的毒性，属于高危致癌物。",o:"主要存在于绿柱石、金绿宝石等矿物中，地壳丰度较低，开采和提炼过程需要严格的安全防护。",u:"用于航太合金、X光窗口、核反应堆中子反射体、高阶音响扬声器及精密仪器零件。",f:"铍的毒性极强，吸入铍粉尘会引发无法根治的铍肺病，因此在工业应用中必须配备极其严格的防护措施。",s:"可溶性铍盐的致死量极低，口服会引发严重的胃肠炎、器官衰竭。长期接触会导致肺部纤维化和肺癌。"},e:{a:"A steel-grey, hard, and lightweight metal with a high melting point and good thermal conductivity, highly transparent to X-rays.",c:"Passivates easily and is relatively stable. However, its dust and soluble salts are extremely toxic and are classified as high-risk carcinogens.",o:"Mainly found in beryl and chrysoberyl. Crustal abundance is relatively low; mining and refining require strict safety precautions.",u:"Used in aerospace alloys, X-ray windows, nuclear reactor neutron reflectors, high-end speaker cones, and precision instruments.",f:"Beryllium is highly toxic; inhaling Be dust causes incurable berylliosis, requiring extremely strict protective measures in industrial applications.",s:"Soluble Be salts are lethal in tiny doses; ingestion causes severe gastroenteritis and organ failure. Chronic exposure causes pulmonary fibrosis and lung cancer."}},
  5:{z:{a:"黑色或棕色的粉末，晶態硼則為黑色且有光澤的堅硬晶體，硬度極高，僅次於金剛石。",c:"常溫下化學性質穩定，高溫下能與氧氣、鹵素、硫等非金屬反應。硼砂水溶液呈弱鹼性。",o:"主要以硼砂、硼酸鹽礦物形式存在於乾涸的鹽湖中，土耳其和美國是世界上最主要的硼礦產地。",u:"用於製造耐熱玻璃、陶瓷、半導體摻雜劑、農用肥料、阻燃劑及中子吸收劑（核工業）。",f:"硼砂在古代曾被用作食物防腐劑和清潔劑。硼的化合物在焰色反應中會呈現出美麗的亮綠色。",s:"硼酸和硼砂具有生殖毒性，大量攝入會導致胃腸道不適、皮膚紅斑，嚴重時可引起休克和死亡。"},h:{a:"黑色或棕色的粉末，晶态硼则为黑色且有光泽的坚硬晶体，硬度极高，仅次于金刚石。",c:"常温下化学性质稳定，高温下能与氧气、卤素、硫等非金属反应。硼砂水溶液呈弱碱性。",o:"主要以硼砂、硼酸盐矿物形式存在于干涸的盐湖中，土耳其和美国是世界上最主要的硼矿产地。",u:"用于制造耐热玻璃、陶瓷、半导体掺杂剂、农用肥料、阻燃剂及中子吸收剂（核工业）。",f:"硼砂在古代曾被用作食物防腐剂和清洁剂。硼的化合物在焰色反应中会呈现出美丽的亮绿色。",s:"硼酸和硼砂具有生殖毒性，大量摄入会导致胃肠道不适、皮肤红斑，严重时可引起休克和死亡。"},e:{a:"Black or brown powder; crystalline boron is a lustrous black solid with very high hardness, second only to diamond.",c:"Stable at room temperature; reacts with oxygen, halogens, and sulfur at high temperatures. Borax solutions are weakly alkaline.",o:"Mainly found as borax and borate minerals in dried salt lakes. Turkey and the USA are the world's main boron producers.",u:"Used in heat-resistant glass, ceramics, semiconductor doping, agricultural fertilisers, flame retardants, and neutron absorbers (nuclear industry).",f:"Borax was once used as a food preservative and cleaner in ancient times. Boron compounds give a beautiful bright green flame test.",s:"Boric acid and borax are reproductive toxins; large doses cause gastrointestinal upset, skin erythema, and can lead to shock and death."}},
  6:{z:{a:"金剛石為無色透明的晶體，石墨為黑色片狀固體，富勒烯為黑色分子晶體，無定形碳為黑色粉末。",c:"常溫下非常穩定，高溫下具有還原性，能與氧氣反應生成二氧化碳或一氧化碳。金剛石硬度極高，石墨則具潤滑性。",o:"廣泛存在於碳酸鹽岩石、化石燃料（煤、石油、天然氣）中，也是所有生物有機分子的骨架元素。",u:"用作燃料、鋼鐵冶煉、有機化學合成的基礎原料。金剛石用於切割工具，石墨用於電極和潤滑劑。",f:"碳能形成數百萬種有機化合物，是生命化學的基礎。金剛石與石墨是同素異形體，物理性質天差地遠。",s:"碳本身無毒，但大量吸入碳粉塵（如煤塵）會導致塵肺病。一氧化碳（碳的氧化物）則具有劇毒。"},h:{a:"金刚石为无色透明的晶体，石墨为黑色片状固体，富勒烯为黑色分子晶体，无定形碳为黑色粉末。",c:"常温下非常稳定，高温下具有还原性，能与氧气反应生成二氧化碳或一氧化碳。金刚石硬度极高，石墨则具润滑性。",o:"广泛存在于碳酸盐岩石、化石燃料（煤、石油、天然气）中，也是所有生物有机分子的骨架元素。",u:"用作燃料、钢铁冶炼、有机化学合成的基础原料。金刚石用于切割工具，石墨用于电极和润滑剂。",f:"碳能形成数百万种有机化合物，是生命化学的基础。金刚石与石墨是同素异形体，物理性质天差地远。",s:"碳本身无毒，但大量吸入碳粉尘（如煤尘）会导致尘肺病。一氧化碳（碳的氧化物）则具有剧毒。"},e:{a:"Diamond is a colourless transparent crystal; graphite is black and flaky; fullerenes are black molecular crystals; amorphous carbon is a black powder.",c:"Very stable at room temperature; reducing at high temperatures, reacting with oxygen to form CO2 or CO. Diamond is extremely hard; graphite is a lubricant.",o:"Widely found in carbonate rocks and fossil fuels (coal, oil, gas). It is also the backbone of all biological organic molecules.",u:"Used as fuel, in steelmaking, and as a basic raw material for organic synthesis. Diamond for cutting tools; graphite for electrodes and lubricants.",f:"Carbon forms millions of organic compounds, the basis of life chemistry. Diamond and graphite are allotropes with vastly different physical properties.",s:"Carbon itself is non-toxic, but inhaling carbon dust (e.g., coal dust) causes pneumoconiosis. Carbon monoxide (its oxide) is highly toxic."}},
  7:{z:{a:"常溫下為無色、無味的雙原子氣體，佔地球大氣的78%，密度略小於空氣，難溶於水。",c:"常溫下化學性質極不活潑，因為氮氣分子中的三鍵非常穩定。高溫或放電條件下可與氧氣、氫氣反應。",o:"大氣中含量約78%，是地球大氣最主要的成分。也存在於硝酸鹽礦物（如硝石）和生物蛋白質中。",u:"用於合成氨與氮肥、硝酸生產、惰性氣氛保護、液氮冷凍與食品包裝、低溫超導冷卻。",f:"氮氣是空氣中含量最高的元素，但其極高的穩定性使其難以被生物直接利用，需依賴固氮菌或閃電轉化。",s:"氮氣本身無毒，但在高壓環境下吸入會導致減壓病。在高濃度下會排擠氧氣導致窒息。"},h:{a:"常温下为无色、无味的双原子气体，占地球大气的78%，密度略小于空气，难溶于水。",c:"常温下化学性质极不活泼，因为氮气分子中的三键非常稳定。高温或放电条件下可与氧气、氢气反应。",o:"大气中含量约78%，是地球大气最主要的成分。也存在于硝酸盐矿物（如硝石）和生物蛋白质中。",u:"用于合成氨与氮肥、硝酸生产、惰性气氛保护、液氮冷冻与食品包装、低温超导冷却。",f:"氮气是空气中含量最高的元素，但其极高的稳定性使其难以被生物直接利用，需依赖固氮菌或闪电转化。",s:"氮气本身无毒，但在高压环境下吸入会导致减压病。在高浓度下会排挤氧气导致窒息。"},e:{a:"A colourless, odourless diatomic gas at room temperature, making up 78% of Earth's atmosphere. Slightly less dense than air, poorly soluble in water.",c:"Very unreactive at room temperature due to the extremely stable triple bond in N2. Reacts with oxygen and hydrogen at high temperatures or under electrical discharge.",o:"About 78% of the atmosphere; the dominant component. Also occurs in nitrate minerals (e.g., saltpetre) and biological proteins.",u:"Used in ammonia and fertiliser synthesis, nitric acid production, inert atmospheres, liquid-nitrogen cooling, food packaging, and cryogenic cooling.",f:"Nitrogen is the most abundant element in air, but its extreme stability makes it hard for organisms to use directly, relying on nitrogen-fixing bacteria or lightning.",s:"Nitrogen gas is non-toxic but inhaling it under high pressure causes decompression sickness. At high concentrations, it displaces oxygen causing asphyxiation."}},
  8:{z:{a:"常溫下為無色、無味的雙原子氣體，佔地球大氣的21%，密度略大於空氣，微溶於水。",c:"具有極強的氧化性，能支持燃燒，與大多數元素都能發生反應，生成氧化物。",o:"地殼中含量最高的元素（約46%），主要以氧化物與矽酸鹽形式存在；大氣中約21%，海洋中大量以水形式存在。",u:"用於醫療氧氣、鋼鐵冶煉、火箭氧化劑、廢水處理以及燃料電池的陰極反應物。",f:"氧氣約佔地殼質量的46%，是地殼中最豐富的元素。臭氧（O₃）層吸收紫外線，保護地表生命。",s:"純氧在常壓下無毒，但在高壓下吸入會導致肺損傷和中樞神經中毒（氧中毒），出現抽搐和昏迷。"},h:{a:"常温下为无色、无味的双原子气体，占地球大气的21%，密度略大于空气，微溶于水。",c:"具有极强的氧化性，能支持燃烧，与大多数元素都能发生反应，生成氧化物。",o:"地壳中含量最高的元素（约46%），主要以氧化物与硅酸盐形式存在；大气中约21%，海洋中大量以水形式存在。",u:"用于医疗氧气、钢铁冶炼、火箭氧化剂、废水处理以及燃料电池的阴极反应物。",f:"氧气约占地壳质量的46%，是地壳中最丰富的元素。臭氧（O₃）层吸收紫外线，保护地表生命。",s:"纯氧在常压下无毒，但在高压下吸入会导致肺损伤和中枢神经中毒（氧中毒），出现抽搐和昏迷。"},e:{a:"A colourless, odourless diatomic gas at room temperature, making up 21% of air. Slightly denser than air, slightly soluble in water.",c:"A strong oxidiser that supports combustion and reacts with most elements to form oxides.",o:"The most abundant element in Earth's crust (~46%), mainly as oxides and silicates. About 21% of the atmosphere and abundant in oceans as water.",u:"Used in medical oxygen, steelmaking, rocket oxidiser, wastewater treatment, and as the cathode reactant in fuel cells.",f:"Oxygen makes up about 46% of the crust by mass. The ozone (O₃) layer absorbs ultraviolet radiation, protecting surface life.",s:"Pure oxygen is non-toxic at normal pressure, but inhaling under high pressure causes lung damage and CNS toxicity (oxygen toxicity), leading to convulsions and coma."}},
  9:{z:{a:"常溫下為淡黃色的氣體，具有強烈的刺激性氣味和極強的腐蝕性，是電負性最高的元素。",c:"化學性質極其活潑，是最強的氧化劑之一，能與幾乎所有元素（包括惰性氣體氙）反應，甚至能與水劇烈反應生成氫氟酸和氧氣。",o:"主要以螢石（CaF₂）與冰晶石形式存在，不以單質存在。地殼中含量約0.05%，主要分佈於花崗岩與沉積岩中。",u:"用於製造含氟聚合物（如鐵氟龍）、氟化物牙膏、冷媒（氟利昂替代品）與鈾濃縮（UF₆）。",f:"氟的化合物在自然界中極其穩定，鐵氟龍因其極低的摩擦係數和耐腐蝕性被稱為「塑料王」。",s:"氟氣是致命毒氣，吸入極低濃度即會嚴重灼傷肺部，引發肺水腫和呼吸衰竭。皮膚接觸會造成深度化學灼傷。"},h:{a:"常温下为淡黄色的气体，具有强烈的刺激性气味和极强的腐蚀性，是电负性最高的元素。",c:"化学性质极其活泼，是最强的氧化剂之一，能与几乎所有元素（包括惰性气体氙）反应，甚至能与水剧烈反应生成氢氟酸和氧气。",o:"主要以萤石（CaF₂）与冰晶石形式存在，不以单质存在。地壳中含量约0.05%，主要分布于花岗岩与沉积岩中。",u:"用于制造含氟聚合物（如特氟龙）、氟化物牙膏、制冷剂（氟利昂替代品）与铀浓缩（UF₆）。",f:"氟的化合物在自然界中极其稳定，特氟龙因其极低的摩擦系数和耐腐蚀性被称为“塑料王”。",s:"氟气是致命毒气，吸入极低浓度即会严重灼伤肺部，引发肺水肿和呼吸衰竭。皮肤接触会造成深度化学灼伤。"},e:{a:"A pale yellow gas at room temperature with a pungent odour and extreme corrosiveness. It has the highest electronegativity of all elements.",c:"Extremely reactive and one of the strongest oxidisers, reacting with almost all elements (including xenon) and even violently with water to form HF and O2.",o:"Mainly found as fluorite (CaF₂) and cryolite, never free. The crust contains about 0.05%, mainly in granites and sedimentary rocks.",u:"Used in fluoropolymers (e.g., Teflon), fluoride toothpaste, refrigerants (CFC replacements), and uranium enrichment (UF₆).",f:"Fluorine compounds are extremely stable. Teflon is called the 'king of plastics' due to its extremely low friction and high corrosion resistance.",s:"Fluorine gas is lethal; inhaling even low concentrations severely burns the lungs, causing pulmonary oedema and respiratory failure. Skin contact causes deep chemical burns."}},
  10:{z:{a:"常溫常壓下為無色、無味、無臭的惰性氣體，密度約為空氣的0.7倍，導熱性較差。",c:"化學性質極不活潑，幾乎不與任何元素反應，以單原子分子形式穩定存在。在放電條件下會發出橙紅色的光。",o:"主要存在於地球大氣中，含量極微（約0.0018%），是通過分餾液態空氣提取的副產品。",u:"用於製造霓虹燈、高壓指示燈、雷射、低溫冷卻劑以及氣體放電管。",f:"氖氣在放電時會發出標誌性的橙紅色光，是霓虹燈（Neon light）的英文名稱來源，點亮了現代城市的夜景。",s:"氖氣本身無毒，但在高濃度下會排擠氧氣，導致缺氧窒息。高壓氣瓶操作不當可能造成物理傷害。"},h:{a:"常温常压下为无色、无味、无臭的惰性气体，密度约为空气的0.7倍，导热性较差。",c:"化学性质极不活泼，几乎不与任何元素反应，以单原子分子形式稳定存在。在放电条件下会发出橙红色的光。",o:"主要存在于地球大气中，含量极微（约0.0018%），是通过分馏液态空气提取的副产品。",u:"用于制造霓虹灯、高压指示灯、激光、低温冷却剂以及气体放电管。",f:"氖气在放电时会发出标志性的橙红色光，是霓虹灯（Neon light）的英文名称来源，点亮了现代城市的夜景。",s:"氖气本身无毒，但在高浓度下会排挤氧气，导致缺氧窒息。高压气瓶操作不当可能造成物理伤害。"},e:{a:"A colourless, odourless, tasteless inert gas at room temperature, about 0.7 times the density of air, with poor thermal conductivity.",c:"Extremely inert, reacting with virtually no elements, existing stably as monatomic molecules. Emits orange-red light under electrical discharge.",o:"Found mainly in Earth's atmosphere in trace amounts (~0.0018%), extracted as a byproduct of fractional distillation of liquid air.",u:"Used in neon signs, high-voltage indicators, lasers, cryogenic coolants, and gas discharge tubes.",f:"Neon emits its signature orange-red glow under discharge, giving its name to 'neon lights' and illuminating modern city nightscapes.",s:"Neon is non-toxic but at high concentrations displaces oxygen, causing asphyxiation. High-pressure cylinders pose physical hazards if mishandled."}},
  11:{z:{a:"銀白色、質地極軟的金屬，可用小刀輕易切開，新切開的表面有金屬光澤，但在空氣中會迅速氧化變暗。",c:"化學活性極高，遇水劇烈反應生成氫氧化鈉和氫氣，燃燒時發出經典的黃色火焰。必須儲存在礦物油中。",o:"以氯化鈉（食鹽）等形式大量存在於海水與岩鹽礦中，不以單質存在。地殼中含量約2.3%，是丰度第六的元素。",u:"用於製造食鹽、純鹼與氯鹼工業、鈉燈、核反應爐冷卻劑（液態鈉）與有機合成還原劑。",f:"鈉的黃色焰色反應是路燈的經典顏色。液態鈉在核反應爐中作為熱傳導介質，因其優異的導熱性而被廣泛應用。",s:"口服金屬鈉會與口腔和胃中的水分劇烈反應，產生氫氧化鈉和氫氣，造成爆炸性局部反應、深度化學灼傷和胃穿孔，極度危險。"},h:{a:"银白色、质地极软的金属，可用小刀轻易切开，新切开的表面有金属光泽，但在空气中会迅速氧化变暗。",c:"化学活性极高，遇水剧烈反应生成氢氧化钠和氢气，燃烧时发出经典的黄色火焰。必须储存在矿物油中。",o:"以氯化钠（食盐）等形式大量存在于海水与岩盐矿中，不以单质存在。地壳中含量约2.3%，是丰度第六的元素。",u:"用于制造食盐、纯碱与氯碱工业、钠灯、核反应堆冷却剂（液态钠）与有机合成还原剂。",f:"钠的黄色焰色反应是路灯的经典颜色。液态钠在核反应堆中作为热传导介质，因其优异的导热性而被广泛应用。",s:"口服金属钠会与口腔和胃中的水分剧烈反应，产生氢氧化钠和氢气，造成爆炸性局部反应、深度化学灼伤和胃穿孔，极度危险。"},e:{a:"A silvery-white, extremely soft metal that can be easily cut with a knife. Freshly cut surfaces are lustrous but tarnish rapidly in air.",c:"Highly reactive; reacts violently with water to form sodium hydroxide and hydrogen gas, burning with a classic yellow flame. Must be stored under mineral oil.",o:"Occurs abundantly as sodium chloride (table salt) in seawater and rock-salt deposits; never found free. Makes up about 2.3% of the crust.",u:"Used in table salt, soda-ash and chlor-alkali industries, sodium lamps, nuclear reactor coolant (liquid sodium), and organic synthesis reducing agents.",f:"Sodium's yellow flame test is the classic street-lamp colour. Liquid sodium serves as a heat-transfer medium in nuclear reactors due to its excellent thermal conductivity.",s:"Ingesting sodium metal reacts violently with moisture in the mouth and stomach to produce NaOH and H2, causing explosive local reactions, deep chemical burns, and perforation. Extremely dangerous."}},
  12:{z:{a:"銀白色、質地較軟的輕金屬，表面在空氣中會形成一層緻密的氧化膜，具有一定的抗腐蝕性。",c:"化學活性較高，燃燒時發出耀眼的白光，能與熱水反應生成氫氧化鎂和氫氣，也能與酸劇烈反應。",o:"以白雲石、菱鎂礦與海水中的鎂離子形式存在，不以單質存在。地殼中含量約2.3%，海水含大量可溶性鎂鹽。",u:"用於製造輕合金（航空、汽車）、煙火與閃光粉、葉綠素的核心金屬、瀉鹽（硫酸鎂）與耐火材料。",f:"鎂是葉綠素分子的核心金屬，沒有鎂就沒有光合作用。鎂燃燒時發出耀眼白光，早期閃光粉即用鎂。",s:"鎂本身無毒，但大量攝入氧化鎂或硫酸鎂會導致腹瀉和電解質失衡。鎂粉塵在空氣中極易燃燒爆炸。"},h:{a:"银白色、质地较软的轻金属，表面在空气中会形成一层致密的氧化膜，具有一定的抗腐蚀性。",c:"化学活性较高，燃烧时发出耀眼的强光，能与热水反应生成氢氧化镁和氢气，也能与酸剧烈反应。",o:"以白云石、菱镁矿与海水中的镁离子形式存在，不以单质存在。地壳中含量约2.3%，海水含大量可溶性镁盐。",u:"用于制造轻合金（航空、汽车）、烟火与闪光粉、叶绿素的核心金属、泻盐（硫酸镁）与耐火材料。",f:"镁是叶绿素分子的核心金属，没有镁就没有光合作用。镁燃烧时发出耀眼强光，早期闪光粉即用镁。",s:"镁本身无毒，但大量摄入氧化镁或硫酸镁会导致腹泻和电解质失衡。镁粉尘在空气中极易燃烧爆炸。"},e:{a:"A silvery-white, relatively soft light metal that forms a dense oxide film in air, providing some corrosion resistance.",c:"Fairly reactive; burns with a brilliant white light, reacts with hot water to form magnesium hydroxide and hydrogen, and reacts vigorously with acids.",o:"Occurs as dolomite, magnesite, and magnesium ions in seawater; never found free. Makes up about 2.3% of the crust; seawater contains abundant soluble Mg salts.",u:"Used in light alloys (aerospace, automotive), fireworks and flares, the core metal of chlorophyll, Epsom salt (MgSO4), and refractories.",f:"Magnesium is the central metal of chlorophyll; without it there is no photosynthesis. Burning Mg emits a brilliant white light, used in early flash powder.",s:"Mg is non-toxic, but large doses of MgO or MgSO4 cause diarrhoea and electrolyte imbalance. Mg dust is highly flammable and explosive in air."}},
  13:{z:{a:"銀白色、質地較軟的輕金屬，具有良好的延展性和導電性，表面在空氣中會迅速形成緻密的氧化膜。",c:"化學活性較高，但在空氣中會形成緻密的氧化鋁保護膜，因此具有優異的抗腐蝕性。能與酸和鹼反應。",o:"地殼中含量最高的金屬元素（約8%），主要以鋁土礦（Al₂O₃·nH₂O）形式存在，少數地區有剛玉等寶石礦藏。",u:"用於輕質結構材料（飛機、汽車、建築）、包裝箔、電纜與炊具；氧化鋁用於冶煉與陶瓷。",f:"鋁在空氣中會迅速形成緻密氧化膜而鈍化，因此耐腐蝕。19世紀時鋁曾比黃金還貴，直到電解煉鋁法問世。",s:"鋁本身無毒，但大量攝入會干擾磷代謝，可能與阿茲海默症有關。鋁粉塵在空氣中易燃易爆。"},h:{a:"银白色、质地较软的轻金属，具有良好的延展性和导电性，表面在空气中会迅速形成致密的氧化膜。",c:"化学活性较高，但在空气中会形成致密的氧化铝保护膜，因此具有优异的抗腐蚀性。能与酸和碱反应。",o:"地壳中含量最高的金属元素（约8%），主要以铝土矿（Al₂O₃·nH₂O）形式存在，少数地区有刚玉等宝石矿藏。",u:"用于轻质结构材料（飞机、汽车、建筑）、包装箔、电缆与炊具；氧化铝用于冶炼与陶瓷。",f:"铝在空气中会迅速形成致密氧化膜而钝化，因此耐腐蚀。19世纪时铝曾比黄金还贵，直到电解炼铝法问世。",s:"铝本身无毒，但大量摄入会干扰磷代谢，可能与阿兹海默症有关。铝粉尘在空气中易燃易爆。"},e:{a:"A silvery-white, relatively soft light metal with good malleability and conductivity. It rapidly forms a dense oxide film in air.",c:"Fairly reactive, but forms a dense protective aluminium oxide layer in air, giving it excellent corrosion resistance. Reacts with both acids and bases.",o:"The most abundant metal in Earth's crust (~8%), mainly as bauxite (Al₂O₃·nH₂O), with some gemstone deposits like corundum.",u:"Used in lightweight structural materials (aircraft, cars, construction), packaging foil, cables and cookware; alumina is used in smelting and ceramics.",f:"Aluminium passivates rapidly in air by forming a dense oxide film, making it corrosion-resistant. In the 19th century it was more expensive than gold until electrolytic smelting was invented.",s:"Aluminium itself is non-toxic, but large intake interferes with phosphate metabolism and may be linked to Alzheimer's. Al dust is flammable and explosive in air."}},
  14:{z:{a:"灰黑色、有金屬光澤的半導體晶體，質地脆硬，是現代半導體工業的核心材料。",c:"常溫下化學性質穩定，高溫下能與氧氣、鹵素等反應。不溶於水，但能溶於強鹼溶液。",o:"地殼中第二豐富的元素（約28%），主要以二氧化矽（石英、砂）與矽酸鹽礦物形式存在，極少以單質游離態出現。",u:"用於製造半導體晶片、太陽能電池、玻璃與陶瓷、矽膠與合金（如矽鋼）。",f:"矽是現代電子工業的基石；高純度單晶矽的純度可達99.9999999%以上，是製造電腦和手機晶片的關鍵。",s:"矽本身無毒，但吸入矽粉塵（二氧化矽）會導致矽肺病，是一種嚴重的職業病。長期接觸可能引發肺部纖維化。"},h:{a:"灰黑色、有金属光泽的半导体晶体，质地脆硬，是现代半导体工业的核心材料。",c:"常温下化学性质稳定，高温下能与氧气、卤素等反应。不溶于水，但能溶于强碱溶液。",o:"地壳中第二丰富的元素（约28%），主要以二氧化硅（石英、砂）与硅酸盐矿物形式存在，极少以单质游离态出现。",u:"用于制造半导体芯片、太阳能电池、玻璃与陶瓷、硅胶与合金（如硅钢）。",f:"硅是现代电子工业的基石；高纯度单晶硅的纯度可达99.9999999%以上，是制造电脑和手机芯片的关键。",s:"硅本身无毒，但吸入硅粉尘（二氧化硅）会导致矽肺病，是一种严重的职业病。长期接触可能引发肺部纤维化。"},e:{a:"A grey-black semiconducting crystal with metallic lustre, brittle and hard. The core material of the modern semiconductor industry.",c:"Stable at room temperature; reacts with oxygen and halogens at high temperatures. Insoluble in water but dissolves in strong alkali.",o:"The second most abundant element in Earth's crust (~28%), mainly as silica (quartz, sand) and silicate minerals; rarely found free.",u:"Used in semiconductor chips, solar cells, glass and ceramics, silicones, and alloys (e.g., silicon steel).",f:"Silicon is the cornerstone of modern electronics; high-purity monocrystalline silicon can exceed 99.9999999% purity, key to computer and phone chips.",s:"Si itself is non-toxic, but inhaling silica dust causes silicosis, a serious occupational disease. Chronic exposure may cause pulmonary fibrosis."}},
  15:{z:{a:"白磷為白色蠟狀固體，紅磷為暗紅色粉末，黑磷為黑色片狀晶體。白磷在暗處會發出微弱的磷光。",c:"白磷在空氣中會自燃，需保存在水中；紅磷較穩定，高溫下才燃燒。磷能與鹵素、氧氣劇烈反應。",o:"主要以磷酸鹽礦物（磷灰石）形式存在，是生物體（DNA、ATP、骨骼）的必需元素。自然界無游離態的磷。",u:"用於製造磷肥、洗滌劑、火柴、煙火與食品添加劑；白磷用於軍事煙幕，紅磷用於安全火柴。",f:"磷是第一個由人類從尿液中分離出的元素（1669年，布蘭德）。白磷在空氣中會自燃，需保存在水中。",s:"白磷劇毒，口服會導致胃腸道嚴重灼傷、肝腎衰竭，致死量約為1毫克/公斤體重。紅磷毒性較低，但長期接觸仍有害。"},h:{a:"白磷为白色蜡状固体，红磷为暗红色粉末，黑磷为黑色片状晶体。白磷在暗处会发出微弱的磷光。",c:"白磷在空气中会自燃，需保存在水中；红磷较稳定，高温下才燃烧。磷能与卤素、氧气剧烈反应。",o:"主要以磷酸盐矿物（磷灰石）形式存在，是生物体（DNA、ATP、骨骼）的必需元素。自然界无游离态的磷。",u:"用于制造磷肥、洗涤剂、火柴、烟火与食品添加剂；白磷用于军事烟幕，红磷用于安全火柴。",f:"磷是第一个由人类从尿液中分离出的元素（1669年，布兰德）。白磷在空气中会自燃，需保存在水中。",s:"白磷剧毒，口服会导致胃肠道严重灼伤、肝腎衰竭，致死量约为1毫克/公斤体重。红磷毒性较低，但长期接触仍有害。"},e:{a:"White phosphorus is a waxy white solid; red phosphorus is a dark red powder; black phosphorus is a black flaky crystal. White P glows faintly in the dark.",c:"White P ignites spontaneously in air and must be stored under water; red P is more stable and burns only at high temperatures. Reacts vigorously with halogens and oxygen.",o:"Occurs mainly as phosphate minerals (apatite); an essential element in living organisms (DNA, ATP, bones). Never found free in nature.",u:"Used in fertilisers, detergents, matches, fireworks, and food additives; white P in military smoke screens; red P in safety matches.",f:"Phosphorus was the first element isolated by humans, from urine (1669, Brand). White P ignites spontaneously in air and must be stored under water.",s:"White P is highly toxic; ingestion causes severe GI burns, liver and kidney failure, with a lethal dose of ~1 mg/kg. Red P is less toxic but chronic exposure is still harmful."}},
  16:{z:{a:"黃色、脆性的非金屬固體，不溶於水，有多種同素異形體（如斜方硫、單斜硫）。",c:"常溫下相對穩定，加熱至沸點會形成硫蒸氣。能與大多數金屬直接化合生成硫化物，燃燒時發出藍色火焰。",o:"以單質（火山硫）與硫化物（黃鐵礦、黃銅礦）及硫酸鹽（石膏）形式存在。地殼中丰度約0.035%。",u:"用於生產硫酸（最重要的工業化學品之一）、橡膠硫化、農藥、火藥與漂白劑。",f:"硫是古代已知的元素之一，聖經中多次提及「硫磺與火」。硫酸被稱為「化學工業之母」，是衡量一個國家工業水平的指標。",s:"硫本身毒性較低，但硫化物（如硫化氫）具劇毒。長期吸入硫粉塵會刺激呼吸道，引起慢性支氣管炎。"},h:{a:"黄色、脆性的非金属固体，不溶于水，有多种同素异形体（如斜方硫、单斜硫）。",c:"常温下相对稳定，加热至沸点会形成硫蒸气。能与大多数金属直接化合生成硫化物，燃烧时发出蓝色火焰。",o:"以单质（火山硫）与硫化物（黄铁矿、黄铜矿）及硫酸盐（石膏）形式存在。地壳中丰度约0.035%。",u:"用于生产硫酸（最重要的工业化学品之一）、橡胶硫化、农药、火药与漂白剂。",f:"硫是古代已知的元素之一，圣经中多次提及“硫磺与火”。硫酸被称为“化学工业之母”，是衡量一个国家工业水平的指标。",s:"硫本身毒性较低，但硫化物（如硫化氢）具剧毒。长期吸入硫粉尘会刺激呼吸道，引起慢性支气管炎。"},e:{a:"A yellow, brittle nonmetal solid, insoluble in water, with several allotropes (e.g., rhombic, monoclinic).",c:"Relatively stable at room temperature; vaporises when heated to boiling. Combines directly with most metals to form sulfides, burning with a blue flame.",o:"Occurs as native sulfur (volcanic), sulfides (pyrite, chalcopyrite) and sulfates (gypsum). Crustal abundance is about 0.035%.",u:"Used in sulfuric acid production (one of the most important industrial chemicals), rubber vulcanisation, pesticides, gunpowder, and bleaches.",f:"Sulfur was known in antiquity and is mentioned repeatedly in the Bible ('fire and brimstone'). Sulfuric acid is called the 'mother of the chemical industry'.",s:"Sulfur itself has low toxicity, but sulfides (e.g., H2S) are highly toxic. Chronic inhalation of sulfur dust irritates the respiratory tract, causing chronic bronchitis."}},
  17:{z:{a:"常溫下為黃綠色的氣體，具有強烈的刺激性氣味，密度比空氣大，可溶於水形成氯水。",c:"具有強氧化性，能與大多數金屬和非金屬反應。與水反應生成鹽酸和次氯酸，後者具有漂白性。",o:"以氯化鈉（食鹽）等形式大量存在於海水與岩鹽中，不以單質存在。地殼中含量約0.013%，主要分佈於海洋。",u:"用於自來水與游泳池消毒、漂白劑、PVC塑料、鹽酸與農藥的生產。",f:"氯氣在第一次世界大戰中曾被用作化學武器，促使日內瓦議定書禁止化學武器。氯是海水中含量最高的鹵素。",s:"氯氣是劇毒氣體，吸入會導致嚴重的呼吸道灼傷、肺水腫和窒息，甚至死亡。皮膚接觸氯水會造成化學灼傷。"},h:{a:"常温下为黄绿色的气体，具有强烈的刺激性气味，密度比空气大，可溶于水形成氯水。",c:"具有强氧化性，能与大多数金属和非金属反应。与水反应生成盐酸和次氯酸，后者具有漂白性。",o:"以氯化钠（食盐）等形式大量存在于海水与岩盐中，不以单质存在。地壳中含量约0.013%，主要分布于海洋。",u:"用于自来水与游泳池消毒、漂白剂、PVC塑料、盐酸与农药的生产。",f:"氯气在第一次世界大战中曾被用作化学武器，促使日内瓦议定书禁止化学武器。氯是海水中含量最高的卤素。",s:"氯气是剧毒气体，吸入会导致严重的呼吸道灼伤、肺水肿和窒息，甚至死亡。皮肤接触氯水会造成化学灼伤。"},e:{a:"A yellow-green gas at room temperature with a pungent odour, denser than air, soluble in water to form chlorine water.",c:"A strong oxidiser, reacting with most metals and nonmetals. Reacts with water to form HCl and hypochlorous acid, the latter being a bleaching agent.",o:"Occurs abundantly as sodium chloride (table salt) in seawater and rock salt; never found free. Makes up ~0.013% of the crust, mainly in oceans.",u:"Used in disinfection of tap water and pools, bleaches, PVC plastics, hydrochloric acid, and pesticides.",f:"Chlorine gas was used as a chemical weapon in WWI, prompting the Geneva Protocol banning chemical weapons. It is the most abundant halogen in seawater.",s:"Chlorine gas is highly toxic; inhalation causes severe respiratory burns, pulmonary oedema, asphyxiation, and death. Skin contact with chlorine water causes chemical burns."}},
  18:{z:{a:"無色、無味、無臭的惰性氣體，是地球大氣中含量最高的稀有氣體，密度約為空氣的1.4倍。",c:"化學性質極不活潑，幾乎不與任何元素反應，以單原子分子形式穩定存在。在放電管中會發出藍紫色的光。",o:"大氣中含量約0.93%，是含量最高的稀有氣體，主要來自鉀-40的放射性衰變。地殼中亦有微量。",u:"用於焊接保護氣、燈泡填充、金屬冶煉保護、食品包裝以及半導體製造中的惰性氣氛。",f:"氬的英文名argon源自希臘語「懶惰」，因其化學惰性而得名。氬氣是焊接時最常用的保護氣體之一。",s:"氬氣本身無毒，但在高濃度下會排擠氧氣，導致缺氧窒息。高壓氣瓶操作不當可能造成物理傷害。"},h:{a:"无色、无味、无臭的惰性气体，是地球大气中含量最高的稀有气体，密度约为空气的1.4倍。",c:"化学性质极不活泼，几乎不与任何元素反应，以单原子分子形式稳定存在。在放电管中会发出蓝紫色的光。",o:"大气中含量约0.93%，是含量最高的稀有气体，主要来自钾-40的放射性衰变。地壳中亦有微量。",u:"用于焊接保护气、灯泡填充、金属冶炼保护、食品包装以及半导体制造中的惰性气氛。",f:"氩的英文名argon源自希腊语“懒惰”，因其化学惰性而得名。氩气是焊接时最常用的保护气体之一。",s:"氩气本身无毒，但在高浓度下会排挤氧气，导致缺氧窒息。高压气瓶操作不当可能造成物理伤害。"},e:{a:"A colourless, odourless, tasteless inert gas; the most abundant noble gas in Earth's atmosphere, about 1.4 times denser than air.",c:"Extremely inert, reacting with virtually no elements, existing stably as monatomic molecules. Emits blue-violet light in a discharge tube.",o:"About 0.93% of the atmosphere, the most abundant noble gas, mainly from radioactive decay of potassium-40. Trace amounts also occur in the crust.",u:"Used in welding shielding gas, lamp filling, metal-smelting protection, food packaging, and inert atmospheres in semiconductor manufacturing.",f:"The name argon comes from the Greek word for 'lazy', reflecting its chemical inertness. Argon is one of the most common shielding gases in welding.",s:"Argon is non-toxic but at high concentrations displaces oxygen, causing asphyxiation. High-pressure cylinders pose physical hazards if mishandled."}},
  19:{z:{a:"銀白色、質地極軟的金屬，可用小刀輕易切開，新切開的表面有金屬光澤，但在空氣中會迅速氧化。",c:"化學活性極高，遇水劇烈反應生成氫氧化鉀和氫氣，燃燒時發出紫色的火焰。必須儲存在礦物油中。",o:"以鉀鹽（鉀石鹽、光鹵石）形式存在，是植物生長的三大必需元素之一。地殼中丰度約2.1%。",u:"用於製造鉀肥、玻璃與肥皂工業、火藥（硝酸鉀）與人體電解質補充。",f:"鉀是人體細胞內最主要的陽離子，對神經與肌肉功能至關重要。鉀的焰色反應呈紫色，是煙火中紫色的來源。",s:"口服金屬鉀會與胃酸劇烈反應產生氫氣，導致胃穿孔。大量攝入可溶性鉀鹽會引起高鉀血症，導致心臟驟停。"},h:{a:"银白色、质地极软的金属，可用小刀轻易切开，新切开的表面有金属光泽，但在空气中会迅速氧化。",c:"化学活性极高，遇水剧烈反应生成氢氧化钾和氢气，燃烧时发出紫色的火焰。必须储存在矿物油中。",o:"以钾盐（钾石盐、光卤石）形式存在，是植物生长的三大必需元素之一。地壳中丰度约2.1%。",u:"用于制造钾肥、玻璃与肥皂工业、火药（硝酸钾）与人体电解质补充。",f:"钾是人体细胞内最主要的阳离子，对神经与肌肉功能至关重要。钾的焰色反应呈紫色，是烟火中紫色的来源。",s:"口服金属钾会与胃酸剧烈反应产生氢气，导致胃穿孔。大量摄入可溶性钾盐会引起高钾血症，导致心脏骤停。"},e:{a:"A silvery-white, extremely soft metal that can be easily cut with a knife. Fresh surfaces are lustrous but tarnish rapidly in air.",c:"Highly reactive; reacts violently with water to form potassium hydroxide and hydrogen gas, burning with a violet flame. Must be stored under mineral oil.",o:"Occurs as potassium salts (sylvite, carnallite); one of the three essential elements for plant growth. Crustal abundance is about 2.1%.",u:"Used in potassium fertilisers, glass and soap industries, gunpowder (potassium nitrate), and human electrolyte supplementation.",f:"Potassium is the main intracellular cation in the human body, essential for nerve and muscle function. Its violet flame test is the source of purple in fireworks.",s:"Ingesting K metal reacts violently with stomach acid producing H2, causing perforation. Large intake of soluble K salts causes hyperkalaemia, leading to cardiac arrest."}},
  20:{z:{a:"銀白色、質地較軟的金屬，具有良好的延展性和導電性，表面在空氣中會形成一層灰白色的氧化膜。",c:"化學活性較高，能與水反應生成氫氧化鈣和氫氣，燃燒時發出橙紅色的火焰。能與鹵素、硫等非金屬化合。",o:"以石灰石（CaCO₃）、石膏（CaSO₄·2H₂O）與螢石等形式大量存在，是骨骼與牙齒的主要成分。地殼中丰度約4.1%。",u:"用於製造水泥與石灰、鋼鐵冶煉助熔劑、鈣片與骨骼健康、農業土壤改良以及煙火中的橙紅色發色劑。",f:"鈣是人體含量最高的金屬元素，約99%存在於骨骼與牙齒中。石灰石與大理石的主要成分都是碳酸鈣。",s:"鈣本身無毒，但靜脈注射鈣鹽可能導致心臟驟停。大量攝入鈣片可能引起高鈣血症、腎結石等問題。"},h:{a:"银白色、质地较软的金属，具有良好的延展性和导电性，表面在空气中会形成一层灰白色的氧化膜。",c:"化学活性较高，能与水反应生成氢氧化钙和氢气，燃烧时发出橙红色的火焰。能与卤素、硫等非金属化合。",o:"以石灰石（CaCO₃）、石膏（CaSO₄·2H₂O）与萤石等形式大量存在，是骨骼与牙齿的主要成分。地壳中丰度约4.1%。",u:"用于制造水泥与石灰、钢铁冶炼助熔剂、钙片与骨骼健康、农业土壤改良以及烟火中的橙红色发色剂。",f:"钙是人体含量最高的金属元素，约99%存在于骨骼与牙齿中。石灰石与大理石的主要成分都是碳酸钙。",s:"钙本身无毒，但静脉注射钙盐可能导致心脏骤停。大量摄入钙片可能引起高钙血症、肾结石等问题。"},e:{a:"A silvery-white, relatively soft metal with good malleability and conductivity. Forms a grey-white oxide film in air.",c:"Fairly reactive; reacts with water to form calcium hydroxide and hydrogen, burning with an orange-red flame. Combines with halogens and sulfur.",o:"Occurs abundantly as limestone (CaCO3), gypsum (CaSO4·2H2O) and fluorite; the main component of bones and teeth. Crustal abundance ~4.1%.",u:"Used in cement and lime, steelmaking flux, calcium supplements and bone health, agricultural soil improvement, and orange-red colourants in fireworks.",f:"Calcium is the most abundant metal in the human body, about 99% in bones and teeth. Limestone and marble are both mainly calcium carbonate.",s:"Calcium is non-toxic, but IV calcium salts can cause cardiac arrest. Large intake of calcium supplements may cause hypercalcaemia and kidney stones."}},

 21:{z:{a:"銀白色金屬，質地較軟，表面易氧化。",c:"與水緩慢反應，溶於酸，高溫下與非金屬反應。",o:"主要產於鈧釔礦，分佈稀少。",u:"用於航空合金、高強度燈具與體育器材。",f:"曾被稱為「稀土中的孤兒」，應用較晚。",s:"無毒，但粉塵可能刺激呼吸道。"},h:{a:"银白色金属，质地较软，表面易氧化。",c:"与水缓慢反应，溶于酸，高温下与非金属反应。",o:"主要产于钪钇矿，分布稀少。",u:"用于航空合金、高强度灯具与体育器材。",f:"曾被称为“稀土中的孤儿”，应用较晚。",s:"无毒，但粉尘可能刺激呼吸道。"},e:{a:"Silvery-white metal, relatively soft, oxidises easily.",c:"Reacts slowly with water, dissolves in acids, reacts with nonmetals at high temps.",o:"Mainly from thortveitite, scarce distribution.",u:"Used in aerospace alloys, high-intensity lamps, sports equipment.",f:"Once called the 'orphan of rare earths', applied late.",s:"Non-toxic, but dust may irritate respiratory tract."}},

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const CW = canvas.width, CH = canvas.height;
const CX = CW/2, CY = CH/2, R = CW/2 - 18;

let rotation = 0;
let spinning = false;
let currentLang = 'zh-Hant';
let currentResultNum = null;

const COLORS = ELEMENTS.map(e=>e.color);
const N = 118;

function shadeColor(hex, factor){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  const f = Math.min(1, Math.max(0, factor));
  return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
}

function drawWheel(){
  ctx.clearRect(0,0,CW,CH);
  const seg = (Math.PI*2)/N;

  for(let i=0;i<N;i++){
    const start = i*seg + rotation;
    const end = start + seg;
    ctx.beginPath();
    ctx.moveTo(CX,CY);
    ctx.arc(CX,CY,R,start,end);
    ctx.closePath();
    const base = COLORS[i];
    ctx.fillStyle = shadeColor(base, i%2===0 ? 0.55 : 0.38);
    ctx.fill();
    ctx.strokeStyle = 'rgba(10,14,23,.55)';
    ctx.lineWidth = 0.7;
    ctx.stroke();

    const mid = start + seg/2;
    ctx.save();
    ctx.translate(CX,CY);
    ctx.rotate(mid);
    const textR = R - 8;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px "Segoe UI",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.fillText(ELEMENTS[i].sym, textR - 22, 0);
    ctx.font = '10px "Segoe UI",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText(ELEMENTS[i].num, textR - 2, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(CX,CY,R+6,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(34,211,238,.25)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function spin(){
  if(spinning) return;
  spinning = true;
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  document.getElementById('wheelStatus').textContent = I18N[currentLang].spinning;

  let targetNum;
  if(window.crypto && window.crypto.getRandomValues){
    const arr = new Uint32Array(1);
    window.crypto.getRandomValues(arr);
    targetNum = (arr[0] % 118) + 1;
  }else{
    targetNum = Math.floor(Math.random()*118)+1;
  }

  const seg = (Math.PI*2)/N;
  const targetCenter = (targetNum-1)*seg + seg/2;
  const pointerAngle = -Math.PI/2;
  const baseRotation = pointerAngle - targetCenter;
  const extraTurns = 8 + Math.floor(Math.random()*5);
  const finalRotation = baseRotation + extraTurns*Math.PI*2 + (Math.random()-0.5)*seg*0.25;

  const startRotation = rotation;
  const delta = finalRotation - startRotation;
  const duration = 4200 + Math.random()*800;
  const t0 = performance.now();

  function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }

  function step(now){
    const elapsed = now - t0;
    const p = Math.min(1, elapsed/duration);
    const eased = easeOutCubic(p);
    rotation = startRotation + delta*eased;
    drawWheel();
    if(p < 1){
      requestAnimationFrame(step);
    }else{
      rotation = finalRotation % (Math.PI*2);
      drawWheel();
      spinning = false;
      btn.disabled = false;
      document.getElementById('wheelStatus').textContent = '';
      setTimeout(()=>{ showDetail(targetNum); }, 450);
    }
  }
  requestAnimationFrame(step);
}

    <div class="danger-block">
      <h3>☠ ${t.safetyTitle}</h3>
      <p><span class="warn-label">${t.safetyWarn}</span>${detail.s}</p>
    </div>

    <button class="again-btn" id="againBtn">${t.again}</button>
  `;

  document.getElementById('detailContent').innerHTML = html;
  
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('detailPage').classList.add('active');
  document.getElementById('detailPage').scrollTop = 0;
  document.getElementById('langBar').style.display = 'none';

  document.getElementById('againBtn').addEventListener('click', ()=>{
    document.getElementById('detailPage').classList.remove('active');
    document.getElementById('wheelPage').classList.add('active');
    document.getElementById('langBar').style.display = '';
    document.getElementById('wheelPage').scrollTop = 0;
  });
}

function applyLanguage(lang){
  currentLang = lang;
  const t = I18N[lang];
  document.getElementById('i18nTitle').textContent = t.title;
  document.getElementById('i18nSubtitle').textContent = t.subtitle;
  document.getElementById('i18nHint').textContent = t.hint;
  document.getElementById('startBtn').textContent = t.start;
  document.getElementById('spinBtn').textContent = t.spin;
  document.querySelectorAll('#langBar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  if(currentResultNum && document.getElementById('detailPage').classList.contains('active')){
    showDetail(currentResultNum);
  }
}

document.getElementById('langBar').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  applyLanguage(btn.dataset.lang);
});

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('startPage').classList.remove('active');
  document.getElementById('wheelPage').classList.add('active');
  drawWheel();
});

document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('wheelWrap').addEventListener('click', ()=>{
  if(!document.getElementById('wheelPage').classList.contains('active')) return;
  if(spinning) return;
  spin();
});

applyLanguage('zh-Hant');
drawWheel();
</script>
</body>
</html>
